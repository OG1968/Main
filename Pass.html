<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה מאובטחת</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #90dcfc;
            padding: 20px;
        }
        .box {
            background: #ffe699;
            padding: 40px 36px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }
        h2 {
            margin: 0 0 8px;
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 13px;
            color: #555;
            margin-bottom: 24px;
            font-weight: 500;
        }
        input {
            padding: 14px 16px;
            width: 100%;
            margin: 0 0 16px;
            border: 2px solid #d0d0d0;
            border-radius: 16px;
            font-size: 16px;
            background: white;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #0d6efd;
        }
        button {
            padding: 14px 0;
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.2s;
        }
        button:hover {
            background: #218838;
            box-shadow: 0 4px 12px rgba(40,167,69,0.3);
        }
        button:active { transform: scale(0.96); }
        #msg {
            color: #dc3545;
            margin-top: 16px;
            min-height: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 כניסה מאובטחת</h2>
        <div class="subtitle">הזן את הסיסמה כדי להמשיך</div>
        <input type="password" id="pass" placeholder="סיסמה" autocomplete="off">
        <button onclick="check()">כניסה</button>
        <div id="msg"></div>
        <div class="footer">© 2026 כל הזכויות שמורות</div>
    </div>

    <script>
        const KEY = "! My Name Is Oren";
        const ENCRYPTED_PASSWORD = "ExV9Tm88BAM=";
        const ENCRYPTED_URL = "cnNiKnNgCRkITA==";

        function xorDecrypt(encoded, key) {
            try {
                const str = atob(encoded);
                let result = '';
                for (let i = 0; i < str.length; i++) {
                    result += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return result;
            } catch (e) {
                return null;
            }
        }

        function check() {
            const input = document.getElementById("pass").value;
            const correctPassword = xorDecrypt(ENCRYPTED_PASSWORD, KEY);
            const targetUrl = xorDecrypt(ENCRYPTED_URL, KEY);

            if (input === correctPassword && targetUrl) {
                window.location.href = targetUrl;
            } else {
                document.getElementById("msg").textContent = "סיסמה שגויה";
                document.getElementById("pass").value = "";
                document.getElementById("pass").focus();
            }
        }

        document.getElementById("pass").addEventListener("keypress", function(e) {
            if (e.key === "Enter") check();
        });
    </script>
</body>
</html>
