<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>עורך PDF מתקדם</title>
    <link rel="icon" href="SP.png" type="image/png">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- pdf-lib + fontkit for Hebrew support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #90dcfc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #ffe699;
            padding: 20px 18px 18px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            height: 95vh;
            max-height: 95vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn:active {
            transform: scale(0.96);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .btn-signature {
            background: #ffffff;
            border: 2px solid #703efa;
            color: #703efa;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-signature:hover, .btn-signature.active {
            background: #703efa;
            color: #ffffff;
            border-color: #703efa;
            box-shadow: 0 4px 12px rgba(112, 62, 250, 0.3);
        }
        .btn-signature:active {
            transform: scale(0.96);
        }

        .btn-text {
            background: #ffffff;
            border: 2px solid #0d6efd;
            color: #0d6efd;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-text:hover, .btn-text.active {
            background: #0d6efd;
            color: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }
        .btn-text:active {
            transform: scale(0.96);
        }

        .btn-checkbox {
            background: #ffffff;
            border: 2px solid #198754;
            color: #198754;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-checkbox:hover, .btn-checkbox.active {
            background: #198754;
            color: #ffffff;
            border-color: #198754;
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);
        }
        .btn-checkbox:active {
            transform: scale(0.96);
        }

        .btn-delete-all {
            background: #ffffff;
            border: 2px solid #dc3545;
            color: #dc3545;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-delete-all:hover {
            background: #dc3545;
            color: #ffffff;
            border-color: #dc3545;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }
        .btn-delete-all:active {
            transform: scale(0.96);
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .upload-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border: 2px dashed #d0d0d0;
            transition: all 0.2s;
        }
        .upload-card:hover {
            border-color: #0d6efd;
            background: #f0f4ff;
        }
        .upload-card label {
            background: #0d6efd;
            color: white;
            padding: 5px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .upload-card label:hover {
            background: #0b5ed7;
        }
        .upload-card input[type="file"] {
            display: none;
        }
        .upload-card .file-status {
            flex: 1;
            font-size: 12px;
            color: #222;
            background: white;
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid #ddd;
            min-width: 70px;
            word-break: break-word;
            text-align: center;
        }
        .upload-card .clear-btn {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 4px 10px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .upload-card .clear-btn:hover {
            background: #5a6268;
        }

        .upload-card.purple label {
            background: #703efa;
        }
        .upload-card.purple label:hover {
            background: #6026ff;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 4px 0 4px;
            justify-content: center;
            background: #f1f3f5;
            padding: 6px 12px;
            border-radius: 50px;
            flex-shrink: 0;
        }

        .page-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 3px 0 4px;
            padding: 4px 12px;
            background: #f1f3f5;
            border-radius: 40px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .page-nav span {
            font-weight: 700;
            font-size: 13px;
            color: #1a1a1a;
        }
        .page-nav .nav-btn {
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 2px 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
            min-width: 40px;
            min-height: 32px;
        }
        .page-nav .nav-btn:hover {
            background: #0b5ed7;
        }
        .page-nav .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-nav .page-num {
            font-weight: 700;
            font-size: 13px;
            min-width: 40px;
            text-align: center;
            background: white;
            padding: 2px 8px;
            border-radius: 30px;
            border: 1px solid #ddd;
        }

        .info-text {
            font-size: 12px;
            color: #444;
            margin: 2px 0 4px;
            text-align: center;
            background: #faf9e6;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            border: 1px solid #eee;
            flex-shrink: 0;
        }

        .pdf-container {
            border: 2px solid #ddd;
            border-radius: 18px;
            overflow: auto;
            background: #e9ecef;
            padding: 10px 6px;
            touch-action: pan-y;
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .pdf-page-wrapper {
            position: relative;
            margin: 0 auto 12px auto;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            display: block !important;
            max-width: 100%;
            /* Critical: force LTR so PDF.js text metrics are not broken by page RTL */
            direction: ltr;
        }
        .pdf-page-wrapper canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            border-radius: 8px;
            /* Prevent RTL inheritance from <html dir="rtl"> which causes
               overlapping / compressed Hebrew glyphs in many PDFs */
            direction: ltr !important;
        }

        .field-overlay {
            position: absolute;
            border: 2.5px solid #703efa;
            border-radius: 8px;
            background: rgba(112, 62, 250, 0.06);
            cursor: grab;
            touch-action: none;
            user-select: none;
            padding: 4px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
            z-index: 10;
            min-width: 16px;
            min-height: 16px;
            display: block !important;
            direction: ltr; /* positioning context */
        }
        .field-overlay.text-field {
            direction: rtl; /* text input stays RTL */
            border-color: #0d6efd;
            background: rgba(13, 110, 253, 0.06);
            display: flex !important;
            flex-direction: column;
            padding: 2px;
        }
        .field-overlay.checkbox-field {
            border-color: #198754;
            background: rgba(25, 135, 84, 0.06);
        }
        .field-overlay textarea {
            width: 100%;
            height: calc(100% - 28px);
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 16px; /* prevents iOS zoom */
            resize: none;
            outline: none;
            padding: 2px 4px;
            cursor: text;
            color: #1a1a1a;
            direction: rtl;
            line-height: 1.35;
        }
        .text-toolbar {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px 4px;
            background: rgba(255,255,255,0.92);
            border-bottom: 1px solid #dde3ea;
            border-radius: 6px 6px 0 0;
            direction: ltr;
            flex-shrink: 0;
            min-height: 26px;
        }
        .text-toolbar .tt-btn {
            border: 1px solid #ccd;
            background: #f8f9fa;
            border-radius: 5px;
            width: 26px;
            height: 22px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: #333;
            line-height: 1;
        }
        .text-toolbar .tt-btn:hover {
            background: #e9ecef;
        }
        .text-toolbar .tt-btn.active {
            background: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
        }
        .text-toolbar .tt-size {
            font-size: 11px;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
            color: #444;
        }
        .text-toolbar .tt-color {
            width: 22px;
            height: 20px;
            border: 1px solid #ccd;
            border-radius: 4px;
            padding: 0;
            cursor: pointer;
            background: none;
        }
        .field-overlay .field-label {
            position: absolute;
            top: -26px;
            right: 0;
            background: #703efa;
            color: white;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            min-height: 24px;
            display: flex;
            align-items: center;
        }
        .field-overlay.text-field .field-label {
            background: #0d6efd;
        }
        .field-overlay.checkbox-field .field-label {
            background: #198754;
        }
        .field-overlay .delete-handle {
            position: absolute;
            top: -26px;
            left: 0;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            touch-action: manipulation;
            min-height: 24px;
            min-width: 28px;
        }
        .field-overlay .delete-handle:hover {
            background: #c82333;
        }
        .field-overlay .resize-handle {
            position: absolute;
            bottom: -12px;
            right: -12px;
            width: 28px;
            height: 28px;
            background: #703efa;
            border-radius: 50%;
            cursor: nwse-resize;
            border: 3px solid white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.25);
            touch-action: none;
        }
        .field-overlay.text-field .resize-handle {
            background: #0d6efd;
        }
        .field-overlay.checkbox-field .resize-handle {
            background: #198754;
        }
        .field-overlay .checkbox-mark {
            font-size: 18px;
            line-height: 1;
            user-select: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .field-overlay .signature-placeholder {
            font-size: 12px;
            color: #94a3b8;
            font-style: italic;
        }
        .field-overlay img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            border-radius: 4px;
        }

        .app-footer {
            margin-top: 6px;
            padding: 4px 0 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .footer-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 0.3px;
            text-align: center;
        }
        .footer-logo {
            height: 1.4em;
            width: auto;
            display: inline-block;
            vertical-align: middle;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a1a;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== Mobile improvements ===== */
        @media (max-width: 768px) {
            body {
                padding: 6px;
            }
            .upload-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .header h1 {
                justify-content: center;
                font-size: 20px;
            }
            .header-actions {
                justify-content: center;
            }
            .container {
                padding: 12px 8px;
                height: 98vh;
                max-height: 98vh;
                border-radius: 16px;
            }
            .toolbar {
                position: sticky;
                bottom: 0;
                z-index: 30;
                border-radius: 16px 16px 0 0;
                padding: 10px 8px;
                gap: 6px;
                margin: 0;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
                background: #f1f3f5;
            }
            .toolbar .btn,
            .toolbar [class*="btn-"] {
                flex: 1;
                min-height: 46px;
                font-size: 13px;
                padding: 8px 6px;
            }
            .page-nav {
                position: sticky;
                top: 0;
                z-index: 25;
                margin: 0 0 6px 0;
            }
            .pdf-container {
                padding: 8px 4px 70px 4px;
            }
            .info-text {
                font-size: 11px;
                padding: 4px 10px;
                display: none; /* save space on mobile */
            }
            .field-overlay .resize-handle {
                width: 32px;
                height: 32px;
                bottom: -14px;
                right: -14px;
            }
        }
        @media (max-width: 480px) {
            .btn {
                font-size: 12px;
                padding: 6px 10px;
            }
            .upload-card {
                padding: 8px 10px;
                flex-direction: column;
                align-items: stretch;
            }
            .upload-card .file-status {
                text-align: center;
            }
            .header h1 {
                font-size: 18px;
            }
            .toolbar .btn,
            .toolbar [class*="btn-"] {
                font-size: 12px;
                padding: 8px 4px;
                min-width: 0;
            }
            .field-overlay .checkbox-mark {
                font-size: 16px;
            }
            .footer-text {
                font-size: 14px;
            }
            .toast {
                bottom: 80px;
                right: 12px;
                left: 12px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>✒️ עורך PDF מתקדם</h1>
            <div class="header-actions">
                <button class="btn btn-success" id="downloadBtn">💾 הורד PDF</button>
            </div>
        </div>

        <div class="upload-grid">
            <div class="upload-card">
                <label for="pdfUpload">📤 טען PDF</label>
                <input type="file" id="pdfUpload" accept=".pdf">
                <span class="file-status" id="pdfFileName">לא נבחר קובץ</span>
                <button class="clear-btn" id="clearPdfBtn">🧹 נקה</button>
            </div>
            <div class="upload-card purple">
                <label for="sigUpload">🖊️ העלה חתימה</label>
                <input type="file" id="sigUpload" accept="image/*,.svg,image/svg+xml">
                <span class="file-status" id="sigStatus">לא נטענה</span>
                <button class="clear-btn" id="clearSigBtn">✖️ הסר</button>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn-signature active" data-tool="signature">✍️ חתימה</button>
            <button class="btn-text" data-tool="text">📃 טקסט</button>
            <button class="btn-checkbox" data-tool="checkbox">❎ סימון</button>
            <button class="btn-delete-all" id="deleteAllBtn">🗑️ מחק הכל</button>
        </div>

        <div class="page-nav">
            <button class="nav-btn" id="prevPage">‹</button>
            <span>📄 עמוד</span>
            <span class="page-num" id="pageNumDisplay">1 / 1</span>
            <button class="nav-btn" id="nextPage">›</button>
        </div>

        <div class="info-text">💡 בחר כלי ← לחץ על הדף להוספה | גרור להזזה | גרור פינה לשינוי גודל</div>

        <div class="pdf-container" id="pdfContainer">
            <div id="pagesContainer"></div>
        </div>

        <div class="app-footer">
            <div class="footer-text">
                <span> © 2026 כל הזכויות שמורות</span>
                <img src="OG_Blue_Logo2.png" alt="לוגו" class="footer-logo" onerror="this.style.display='none'">
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ===== PDF.js Worker (performance) =====
            if (typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }

            let pdfDoc = null;
            let pdfDataArrayBuffer = null;
            let currentPage = 1;
            let totalPages = 0;
            let scale = 1.5;

            let fields = [];
            let fieldIdCounter = 0;
            let selectedTool = 'signature';
            let signatureImageData = null;

            // Drag / Resize state
            let isDragging = false;
            let dragTarget = null;
            let dragOffsetX = 0, dragOffsetY = 0;
            let isResizing = false;
            let resizeTarget = null;
            let resizeStartX = 0, resizeStartY = 0;
            let resizeStartW = 0, resizeStartH = 0;
            let resizeScale = 1;

            let pageWidths = [];
            let pageHeights = [];

            // Touch state
            let touchDragData = null;
            let touchResizeData = null;

            const container = document.getElementById('pdfContainer');
            const pagesContainer = document.getElementById('pagesContainer');
            const pdfUpload = document.getElementById('pdfUpload');
            const sigUpload = document.getElementById('sigUpload');
            const pdfFileName = document.getElementById('pdfFileName');
            const sigStatus = document.getElementById('sigStatus');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearPdfBtn = document.getElementById('clearPdfBtn');
            const clearSigBtn = document.getElementById('clearSigBtn');
            const deleteAllBtn = document.getElementById('deleteAllBtn');
            const pageNumDisplay = document.getElementById('pageNumDisplay');
            const prevPage = document.getElementById('prevPage');
            const nextPage = document.getElementById('nextPage');
            const toastEl = document.getElementById('toast');

            function showToast(msg, duration = 2800) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastEl._timeout);
                toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), duration);
            }

            function getPageWrapper(pageNum) {
                return document.querySelector(`.pdf-page-wrapper[data-page="${pageNum}"]`);
            }

            function getPageCanvas(pageNum) {
                const wrapper = getPageWrapper(pageNum);
                return wrapper ? wrapper.querySelector('canvas') : null;
            }

            function getFieldElement(id) {
                return document.querySelector(`.field-overlay[data-field-id="${id}"]`);
            }

            // ===== Load PDF =====
            function loadPdfFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pdfDataArrayBuffer = e.target.result;
                    const bufferForPdfjs = pdfDataArrayBuffer.slice(0);
                    pdfFileName.textContent = file.name;

                    // cMap + standard fonts are required for many Hebrew / government PDFs
                    pdfjsLib.getDocument({
                        data: bufferForPdfjs,
                        cMapUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/cmaps/',
                        cMapPacked: true,
                        standardFontDataUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/standard_fonts/',
                        useSystemFonts: true,
                        disableFontFace: false
                    }).promise.then(doc => {
                        pdfDoc = doc;
                        totalPages = doc.numPages;
                        currentPage = 1;
                        fields = [];
                        fieldIdCounter = 0;
                        pageWidths = [];
                        pageHeights = [];
                        renderAllPages();
                        showToast('✅ PDF נטען בהצלחה');
                    }).catch(err => {
                        showToast('❌ שגיאה: ' + err.message);
                        console.error(err);
                    });
                };
                reader.readAsArrayBuffer(file);
            }

            // ===== Convert any image (including SVG) to PNG data-URL =====
            function imageFileToPngDataUrl(file) {
                return new Promise((resolve, reject) => {
                    const isSvg = file.type === 'image/svg+xml' ||
                                  file.name.toLowerCase().endsWith('.svg');

                    if (isSvg) {
                        // SVG → Canvas → PNG
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const svgText = e.target.result;
                            const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
                            const url = URL.createObjectURL(blob);
                            const img = new Image();
                            img.onload = function() {
                                try {
                                    // Use intrinsic size or fallback
                                    const w = img.naturalWidth || img.width || 400;
                                    const h = img.naturalHeight || img.height || 200;
                                    const canvas = document.createElement('canvas');
                                    // Higher resolution for crisp signatures
                                    const scaleFactor = 2;
                                    canvas.width = w * scaleFactor;
                                    canvas.height = h * scaleFactor;
                                    const ctx = canvas.getContext('2d');
                                    ctx.scale(scaleFactor, scaleFactor);
                                    ctx.drawImage(img, 0, 0, w, h);
                                    const pngDataUrl = canvas.toDataURL('image/png');
                                    URL.revokeObjectURL(url);
                                    resolve(pngDataUrl);
                                } catch (err) {
                                    URL.revokeObjectURL(url);
                                    reject(err);
                                }
                            };
                            img.onerror = function() {
                                URL.revokeObjectURL(url);
                                reject(new Error('Failed to load SVG'));
                            };
                            img.src = url;
                        };
                        reader.onerror = () => reject(new Error('Failed to read SVG file'));
                        reader.readAsText(file);
                    } else {
                        // Regular raster images (PNG, JPG, WEBP, GIF, etc.)
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            // Optionally normalize everything to PNG for maximum compatibility
                            const dataUrl = e.target.result;
                            if (file.type === 'image/png' || dataUrl.startsWith('data:image/png')) {
                                resolve(dataUrl);
                                return;
                            }
                            // Convert other formats to PNG via canvas for consistent embedding
                            const img = new Image();
                            img.onload = function() {
                                try {
                                    const canvas = document.createElement('canvas');
                                    canvas.width = img.naturalWidth || img.width;
                                    canvas.height = img.naturalHeight || img.height;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(img, 0, 0);
                                    resolve(canvas.toDataURL('image/png'));
                                } catch (err) {
                                    // Fallback to original data URL
                                    resolve(dataUrl);
                                }
                            };
                            img.onerror = () => resolve(dataUrl);
                            img.src = dataUrl;
                        };
                        reader.onerror = () => reject(new Error('Failed to read image file'));
                        reader.readAsDataURL(file);
                    }
                });
            }

            // ===== Load Signature (supports PNG, JPG, WEBP, GIF, SVG, ...) =====
            async function loadSignatureFile(file) {
                try {
                    showToast('⏳ מעבד חתימה...');
                    const dataUrl = await imageFileToPngDataUrl(file);
                    signatureImageData = dataUrl;
                    sigStatus.textContent = '✅ חתימה נטענה';
                    showToast('✅ חתימה נטענה' + (file.name.toLowerCase().endsWith('.svg') ? ' (SVG→PNG)' : ''));
                    // Update existing signature fields that have no image
                    fields.forEach(f => {
                        if (f.type === 'signature' && !f.value) {
                            f.value = signatureImageData;
                        }
                    });
                    renderFields();
                } catch (err) {
                    console.error(err);
                    showToast('❌ שגיאה בטעינת חתימה: ' + err.message);
                }
            }

            // ===== Render all pages =====
            async function renderAllPages() {
                if (!pdfDoc) return;
                pagesContainer.innerHTML = '';
                pageWidths = [];
                pageHeights = [];

                const containerWidth = Math.max(280, container.clientWidth - 24);

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1 });
                    const width = viewport.width;
                    const height = viewport.height;
                    pageWidths.push(width);
                    pageHeights.push(height);

                    let idealScale = containerWidth / width;
                    idealScale = Math.min(2.2, Math.max(0.45, idealScale));
                    scale = idealScale;

                    const scaledViewport = page.getViewport({ scale: scale });
                    const wrapper = document.createElement('div');
                    wrapper.className = 'pdf-page-wrapper';
                    wrapper.dataset.page = i;
                    wrapper.dir = 'ltr';                 // force LTR – critical for correct Hebrew glyph metrics
                    wrapper.style.position = 'relative';
                    wrapper.style.width = scaledViewport.width + 'px';
                    wrapper.style.margin = '0 auto 12px auto';
                    wrapper.style.maxWidth = '100%';
                    wrapper.style.direction = 'ltr';

                    const canvas = document.createElement('canvas');
                    canvas.width = scaledViewport.width;
                    canvas.height = scaledViewport.height;
                    canvas.dir = 'ltr';
                    canvas.style.display = 'block';
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';
                    canvas.style.direction = 'ltr';

                    wrapper.appendChild(canvas);
                    pagesContainer.appendChild(wrapper);

                    const renderContext = {
                        canvasContext: canvas.getContext('2d'),
                        viewport: scaledViewport
                    };
                    await page.render(renderContext).promise;
                }

                renderFields();
                updatePageNav();
                showToast('✅ הדפים נטענו');
            }

            // ===== Add field =====
            function addField(pageNum, x, y) {
                if (!selectedTool || selectedTool === 'cursor') {
                    showToast('ℹ️ בחר כלי תחילה');
                    return;
                }

                const pageIndex = pageNum - 1;
                const field = {
                    id: fieldIdCounter++,
                    type: selectedTool,
                    pageIndex: pageIndex,
                    x: x,
                    y: y,
                    w: 140,
                    h: 30,
                    value: '',
                    fontSize: 14,
                    color: '#1a1a1a',
                    bold: false,
                    underline: false,
                    align: 'right'
                };

                if (selectedTool === 'signature') {
                    field.w = 160;
                    field.h = 60;
                    field.value = signatureImageData || '';
                } else if (selectedTool === 'checkbox') {
                    field.w = 22;
                    field.h = 22;
                    field.value = false;
                } else if (selectedTool === 'text') {
                    field.w = 200;
                    field.h = 56;
                    field.value = '';
                    field.fontSize = 14;
                    field.color = '#1a1a1a';
                    field.bold = false;
                    field.underline = false;
                    field.align = 'right';
                }

                // Keep inside page bounds
                field.x = Math.max(0, Math.min(field.x, pageWidths[pageIndex] - field.w));
                field.y = Math.max(0, Math.min(field.y, pageHeights[pageIndex] - field.h));

                fields.push(field);
                renderFields();
                showToast('✅ שדה נוסף');
            }

            // ===== Render fields (full) =====
            function renderFields() {
                // Remove existing overlays
                document.querySelectorAll('.field-overlay').forEach(el => el.remove());

                for (const f of fields) {
                    const pageNum = f.pageIndex + 1;
                    const wrapper = getPageWrapper(pageNum);
                    if (!wrapper) continue;
                    const canvas = wrapper.querySelector('canvas');
                    if (!canvas) continue;

                    const scale = canvas.width / pageWidths[f.pageIndex];
                    const relX = f.x * scale;
                    const relY = f.y * scale;
                    const relW = f.w * scale;
                    const relH = f.h * scale;

                    const el = document.createElement('div');
                    el.className = 'field-overlay';
                    if (f.type === 'text') el.classList.add('text-field');
                    if (f.type === 'checkbox') el.classList.add('checkbox-field');
                    el.dataset.fieldId = f.id;
                    el.style.left = relX + 'px';
                    el.style.top = relY + 'px';
                    el.style.width = relW + 'px';
                    el.style.height = relH + 'px';

                    // Label
                    const label = document.createElement('div');
                    label.className = 'field-label';
                    const labels = { text: 'טקסט', signature: 'חתימה', checkbox: 'סימון' };
                    label.textContent = labels[f.type] || f.type;
                    el.appendChild(label);

                    // Content
                    if (f.type === 'text') {
                        // Mini toolbar for font controls
                        const align = f.align || 'right';
                        const toolbar = document.createElement('div');
                        toolbar.className = 'text-toolbar';
                        toolbar.innerHTML = `
                            <button type="button" class="tt-btn tt-dec" title="הקטן גופן">A−</button>
                            <span class="tt-size">${f.fontSize || 14}</span>
                            <button type="button" class="tt-btn tt-inc" title="הגדל גופן">A+</button>
                            <input type="color" class="tt-color" value="${f.color || '#1a1a1a'}" title="צבע">
                            <button type="button" class="tt-btn tt-bold ${f.bold ? 'active' : ''}" title="הדגשה"><b>B</b></button>
                            <button type="button" class="tt-btn tt-underline ${f.underline ? 'active' : ''}" title="קו תחתון"><u>U</u></button>
                            <button type="button" class="tt-btn tt-align-right ${align === 'right' ? 'active' : ''}" title="ישור לימין">▶|</button>
                            <button type="button" class="tt-btn tt-align-center ${align === 'center' ? 'active' : ''}" title="ישור למרכז">|▶|</button>
                            <button type="button" class="tt-btn tt-align-left ${align === 'left' ? 'active' : ''}" title="ישור לשמאל">|◀</button>
                        `;
                        toolbar.addEventListener('mousedown', (e) => e.stopPropagation());
                        toolbar.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
                        toolbar.addEventListener('click', (e) => e.stopPropagation());

                        const ta = document.createElement('textarea');
                        ta.value = f.value || '';
                        ta.placeholder = 'הקלד טקסט...';
                        ta.style.fontSize = (f.fontSize || 14) + 'px';
                        ta.style.color = f.color || '#1a1a1a';
                        ta.style.fontWeight = f.bold ? 'bold' : 'normal';
                        ta.style.textDecoration = f.underline ? 'underline' : 'none';
                        ta.style.textAlign = align;
                        ta.addEventListener('input', (e) => { f.value = e.target.value; });
                        ta.addEventListener('mousedown', (e) => e.stopPropagation());
                        ta.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
                        ta.addEventListener('click', (e) => e.stopPropagation());

                        // Toolbar actions
                        toolbar.querySelector('.tt-dec').addEventListener('click', (e) => {
                            e.stopPropagation();
                            f.fontSize = Math.max(8, (f.fontSize || 14) - 1);
                            ta.style.fontSize = f.fontSize + 'px';
                            toolbar.querySelector('.tt-size').textContent = f.fontSize;
                        });
                        toolbar.querySelector('.tt-inc').addEventListener('click', (e) => {
                            e.stopPropagation();
                            f.fontSize = Math.min(48, (f.fontSize || 14) + 1);
                            ta.style.fontSize = f.fontSize + 'px';
                            toolbar.querySelector('.tt-size').textContent = f.fontSize;
                        });
                        toolbar.querySelector('.tt-color').addEventListener('input', (e) => {
                            e.stopPropagation();
                            f.color = e.target.value;
                            ta.style.color = f.color;
                        });
                        toolbar.querySelector('.tt-bold').addEventListener('click', (e) => {
                            e.stopPropagation();
                            f.bold = !f.bold;
                            ta.style.fontWeight = f.bold ? 'bold' : 'normal';
                            e.currentTarget.classList.toggle('active', f.bold);
                        });
                        toolbar.querySelector('.tt-underline').addEventListener('click', (e) => {
                            e.stopPropagation();
                            f.underline = !f.underline;
                            ta.style.textDecoration = f.underline ? 'underline' : 'none';
                            e.currentTarget.classList.toggle('active', f.underline);
                        });

                        function setAlign(newAlign) {
                            f.align = newAlign;
                            ta.style.textAlign = newAlign;
                            toolbar.querySelector('.tt-align-right').classList.toggle('active', newAlign === 'right');
                            toolbar.querySelector('.tt-align-center').classList.toggle('active', newAlign === 'center');
                            toolbar.querySelector('.tt-align-left').classList.toggle('active', newAlign === 'left');
                        }
                        toolbar.querySelector('.tt-align-right').addEventListener('click', (e) => {
                            e.stopPropagation();
                            setAlign('right');
                        });
                        toolbar.querySelector('.tt-align-center').addEventListener('click', (e) => {
                            e.stopPropagation();
                            setAlign('center');
                        });
                        toolbar.querySelector('.tt-align-left').addEventListener('click', (e) => {
                            e.stopPropagation();
                            setAlign('left');
                        });

                        el.appendChild(toolbar);
                        el.appendChild(ta);
                    } else if (f.type === 'checkbox') {
                        const span = document.createElement('span');
                        span.className = 'checkbox-mark';
                        const size = Math.min(f.w, f.h);
                        const fontSize = Math.max(10, Math.min(22, size * 0.85));
                        span.style.fontSize = fontSize + 'px';
                        span.textContent = f.value ? '☑' : '☐';
                        span.addEventListener('click', (e) => {
                            e.stopPropagation();
                            f.value = !f.value;
                            span.textContent = f.value ? '☑' : '☐';
                        });
                        el.appendChild(span);
                    } else if (f.type === 'signature') {
                        if (f.value) {
                            const img = document.createElement('img');
                            img.src = f.value;
                            el.appendChild(img);
                        } else {
                            const span = document.createElement('span');
                            span.className = 'signature-placeholder';
                            span.textContent = '✍️ חתימה';
                            el.appendChild(span);
                        }
                    }

                    // Delete button
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-handle';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        fields = fields.filter(field => field.id !== f.id);
                        renderFields();
                        showToast('🗑️ שדה נמחק');
                    });
                    el.appendChild(delBtn);

                    // Resize handle
                    const resizeHandle = document.createElement('div');
                    resizeHandle.className = 'resize-handle';
                    resizeHandle.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        startResize(e, f);
                    });
                    resizeHandle.addEventListener('touchstart', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        startResizeTouch(e, f);
                    }, { passive: false });
                    el.appendChild(resizeHandle);

                    // Drag handlers
                    el.addEventListener('mousedown', (e) => {
                        if (e.target === delBtn || e.target === resizeHandle) return;
                        if (f.type === 'text' && e.target.tagName === 'TEXTAREA') return;
                        startDrag(e, f);
                    });
                    el.addEventListener('touchstart', (e) => {
                        if (e.target === delBtn || e.target === resizeHandle) return;
                        if (f.type === 'text' && e.target.tagName === 'TEXTAREA') return;
                        startDragTouch(e, f);
                    }, { passive: false });

                    wrapper.appendChild(el);
                }
            }

            // ===== Drag (optimized - direct style update) =====
            function startDrag(e, field) {
                isDragging = true;
                dragTarget = field;
                const el = e.target.closest('.field-overlay');
                const rect = el.getBoundingClientRect();
                dragOffsetX = e.clientX - rect.left;
                dragOffsetY = e.clientY - rect.top;
                el.style.cursor = 'grabbing';
                e.preventDefault();
            }

            function onDragMove(e) {
                if (!isDragging || !dragTarget) return;
                const pageNum = dragTarget.pageIndex + 1;
                const canvas = getPageCanvas(pageNum);
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const s = canvas.width / pageWidths[dragTarget.pageIndex];

                let newX = (e.clientX - rect.left - dragOffsetX) / s;
                let newY = (e.clientY - rect.top - dragOffsetY) / s;
                newX = Math.max(0, Math.min(newX, pageWidths[dragTarget.pageIndex] - dragTarget.w));
                newY = Math.max(0, Math.min(newY, pageHeights[dragTarget.pageIndex] - dragTarget.h));

                dragTarget.x = newX;
                dragTarget.y = newY;

                // Direct update - no full re-render
                const el = getFieldElement(dragTarget.id);
                if (el) {
                    el.style.left = (newX * s) + 'px';
                    el.style.top  = (newY * s) + 'px';
                }
            }

            function onDragEnd() {
                if (isDragging) {
                    isDragging = false;
                    dragTarget = null;
                    document.querySelectorAll('.field-overlay').forEach(el => el.style.cursor = 'grab');
                }
            }

            // Touch drag
            function startDragTouch(e, field) {
                const touch = e.touches[0];
                const el = e.target.closest('.field-overlay');
                const rect = el.getBoundingClientRect();
                touchDragData = {
                    field,
                    offsetX: touch.clientX - rect.left,
                    offsetY: touch.clientY - rect.top
                };
                e.preventDefault();
            }

            // ===== Resize (optimized + correct scale) =====
            function startResize(e, field) {
                isResizing = true;
                resizeTarget = field;
                resizeStartX = e.clientX;
                resizeStartY = e.clientY;
                resizeStartW = field.w;
                resizeStartH = field.h;
                const canvas = getPageCanvas(field.pageIndex + 1);
                resizeScale = canvas ? (canvas.width / pageWidths[field.pageIndex]) : 1;
                e.preventDefault();
            }

            function onResizeMove(e) {
                if (!isResizing || !resizeTarget) return;
                const dx = (e.clientX - resizeStartX) / resizeScale;
                const dy = (e.clientY - resizeStartY) / resizeScale;
                const minSize = resizeTarget.type === 'checkbox' ? 12 : 28;
                const newW = Math.max(minSize, resizeStartW + dx);
                const newH = Math.max(minSize, resizeStartH + dy);

                // Keep inside page
                const maxW = pageWidths[resizeTarget.pageIndex] - resizeTarget.x;
                const maxH = pageHeights[resizeTarget.pageIndex] - resizeTarget.y;
                resizeTarget.w = Math.min(newW, maxW);
                resizeTarget.h = Math.min(newH, maxH);

                // Direct update
                const el = getFieldElement(resizeTarget.id);
                if (el) {
                    el.style.width  = (resizeTarget.w * resizeScale) + 'px';
                    el.style.height = (resizeTarget.h * resizeScale) + 'px';
                    // Update checkbox font size if needed
                    if (resizeTarget.type === 'checkbox') {
                        const span = el.querySelector('.checkbox-mark');
                        if (span) {
                            const size = Math.min(resizeTarget.w, resizeTarget.h);
                            span.style.fontSize = Math.max(10, Math.min(22, size * 0.85)) + 'px';
                        }
                    }
                }
            }

            function onResizeEnd() {
                isResizing = false;
                resizeTarget = null;
            }

            // Touch resize
            function startResizeTouch(e, field) {
                const touch = e.touches[0];
                const canvas = getPageCanvas(field.pageIndex + 1);
                const s = canvas ? (canvas.width / pageWidths[field.pageIndex]) : 1;
                touchResizeData = {
                    field,
                    startX: touch.clientX,
                    startY: touch.clientY,
                    startW: field.w,
                    startH: field.h,
                    scale: s
                };
                e.preventDefault();
            }

            // ===== Global pointer / touch handlers =====
            document.addEventListener('mousemove', (e) => {
                onDragMove(e);
                onResizeMove(e);
            });
            document.addEventListener('mouseup', () => {
                onDragEnd();
                onResizeEnd();
            });

            document.addEventListener('touchmove', (e) => {
                if (touchDragData) {
                    const touch = e.touches[0];
                    const field = touchDragData.field;
                    const pageNum = field.pageIndex + 1;
                    const canvas = getPageCanvas(pageNum);
                    if (!canvas) return;
                    const rect = canvas.getBoundingClientRect();
                    const s = canvas.width / pageWidths[field.pageIndex];

                    let newX = (touch.clientX - rect.left - touchDragData.offsetX) / s;
                    let newY = (touch.clientY - rect.top - touchDragData.offsetY) / s;
                    newX = Math.max(0, Math.min(newX, pageWidths[field.pageIndex] - field.w));
                    newY = Math.max(0, Math.min(newY, pageHeights[field.pageIndex] - field.h));
                    field.x = newX;
                    field.y = newY;

                    const el = getFieldElement(field.id);
                    if (el) {
                        el.style.left = (newX * s) + 'px';
                        el.style.top  = (newY * s) + 'px';
                    }
                    e.preventDefault();
                } else if (touchResizeData) {
                    const touch = e.touches[0];
                    const { field, startX, startY, startW, startH, scale: s } = touchResizeData;
                    const dx = (touch.clientX - startX) / s;
                    const dy = (touch.clientY - startY) / s;
                    const minSize = field.type === 'checkbox' ? 12 : 28;
                    let newW = Math.max(minSize, startW + dx);
                    let newH = Math.max(minSize, startH + dy);
                    newW = Math.min(newW, pageWidths[field.pageIndex] - field.x);
                    newH = Math.min(newH, pageHeights[field.pageIndex] - field.y);
                    field.w = newW;
                    field.h = newH;

                    const el = getFieldElement(field.id);
                    if (el) {
                        el.style.width  = (newW * s) + 'px';
                        el.style.height = (newH * s) + 'px';
                        if (field.type === 'checkbox') {
                            const span = el.querySelector('.checkbox-mark');
                            if (span) {
                                const size = Math.min(newW, newH);
                                span.style.fontSize = Math.max(10, Math.min(22, size * 0.85)) + 'px';
                            }
                        }
                    }
                    e.preventDefault();
                }
            }, { passive: false });

            document.addEventListener('touchend', () => {
                touchDragData = null;
                touchResizeData = null;
            });
            document.addEventListener('touchcancel', () => {
                touchDragData = null;
                touchResizeData = null;
            });

            // ===== Click on page to add field =====
            pagesContainer.addEventListener('click', function(e) {
                if (e.target.closest('.field-overlay')) return;
                if (e.target.closest('textarea')) return;
                if (!selectedTool) return;

                const wrapper = e.target.closest('.pdf-page-wrapper');
                if (!wrapper) return;
                const canvas = wrapper.querySelector('canvas');
                if (!canvas) return;
                const pageNum = parseInt(wrapper.dataset.page, 10);
                const rect = canvas.getBoundingClientRect();
                const s = canvas.width / pageWidths[pageNum - 1];

                const x = (e.clientX - rect.left) / s;
                const y = (e.clientY - rect.top) / s;
                addField(pageNum, x, y);
            });

            // ===== Tool selection =====
            document.querySelectorAll('[data-tool]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedTool = this.dataset.tool;
                    showToast('🔧 כלי: ' + this.textContent.trim());
                });
            });

            // ===== Page navigation =====
            function updatePageNav() {
                pageNumDisplay.textContent = `${currentPage} / ${totalPages || 1}`;
                prevPage.disabled = currentPage <= 1;
                nextPage.disabled = currentPage >= totalPages;
            }

            function goToPage(pageNum) {
                if (pageNum < 1 || pageNum > totalPages) return;
                currentPage = pageNum;
                updatePageNav();
                const wrapper = getPageWrapper(pageNum);
                if (wrapper) {
                    wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            prevPage.addEventListener('click', () => goToPage(currentPage - 1));
            nextPage.addEventListener('click', () => goToPage(currentPage + 1));

            // ===== Delete all =====
            deleteAllBtn.addEventListener('click', () => {
                if (fields.length === 0) {
                    showToast('אין שדות למחיקה');
                    return;
                }
                if (confirm('למחוק את כל השדות?')) {
                    fields = [];
                    renderFields();
                    showToast('🗑️ כל השדות נמחקו');
                }
            });

            // ===== Clear PDF =====
            clearPdfBtn.addEventListener('click', () => {
                pdfDoc = null;
                pdfDataArrayBuffer = null;
                pdfFileName.textContent = 'לא נבחר קובץ';
                pagesContainer.innerHTML = '';
                totalPages = 0;
                currentPage = 1;
                fields = [];
                fieldIdCounter = 0;
                pageWidths = [];
                pageHeights = [];
                updatePageNav();
                pdfUpload.value = '';
                showToast('🧹 PDF נוקה');
            });

            // ===== Clear signature =====
            clearSigBtn.addEventListener('click', () => {
                signatureImageData = null;
                sigStatus.textContent = 'לא נטענה';
                sigUpload.value = '';
                // Clear value from existing signature fields
                fields.forEach(f => {
                    if (f.type === 'signature') f.value = '';
                });
                renderFields();
                showToast('✖️ חתימה הוסרה');
            });

            // ===== Download PDF (with Hebrew font support) =====
            downloadBtn.addEventListener('click', async function() {
                if (!pdfDataArrayBuffer) {
                    showToast('❌ אין PDF');
                    return;
                }

                try {
                    showToast('⏳ מכין PDF...');
                    const bufferCopy = pdfDataArrayBuffer.slice(0);
                    const newDoc = await PDFLib.PDFDocument.load(bufferCopy);

                    // Register fontkit for custom fonts
                    if (typeof fontkit !== 'undefined') {
                        newDoc.registerFontkit(fontkit);
                    }

                    // Try to embed a Hebrew-supporting font
                    let hebrewFont = null;
                    try {
                        // Noto Sans Hebrew (public CDN)
                        const fontUrl = 'https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansHebrew/NotoSansHebrew-Regular.ttf';
                        const fontBytes = await fetch(fontUrl).then(r => {
                            if (!r.ok) throw new Error('Font fetch failed');
                            return r.arrayBuffer();
                        });
                        hebrewFont = await newDoc.embedFont(fontBytes, { subset: true });
                    } catch (fontErr) {
                        console.warn('Could not load Hebrew font, falling back to Helvetica:', fontErr);
                        hebrewFont = await newDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                    }

                    const fallbackFont = await newDoc.embedFont(PDFLib.StandardFonts.Helvetica);

                    for (const f of fields) {
                        const page = newDoc.getPage(f.pageIndex);
                        const { width, height } = page.getSize();
                        const x = f.x;
                        const y = height - f.y - f.h;

                        if (f.type === 'text') {
                            const rawText = (f.value || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                            const lines = rawText.split('\n').filter((ln, idx, arr) => ln.length > 0 || idx < arr.length - 1);
                            if (lines.length && lines.some(l => l.trim())) {
                                const fontSize = f.fontSize || 14;
                                const lineHeight = fontSize * 1.35;
                                // Parse color (#rrggbb)
                                let r = 0.1, g = 0.1, b = 0.1;
                                if (f.color && /^#([0-9a-fA-F]{6})$/.test(f.color)) {
                                    r = parseInt(f.color.slice(1, 3), 16) / 255;
                                    g = parseInt(f.color.slice(3, 5), 16) / 255;
                                    b = parseInt(f.color.slice(5, 7), 16) / 255;
                                }
                                const textColor = PDFLib.rgb(r, g, b);
                                const font = hebrewFont || fallbackFont;
                                const align = f.align || 'right';
                                // PDF Y grows upward. Field top in PDF coords:
                                const fieldTopPdf = height - f.y;
                                // Start first line near the top of the field
                                let textY = fieldTopPdf - fontSize - 3;
                                const maxW = Math.max(10, f.w - 6);

                                for (let i = 0; i < lines.length; i++) {
                                    const line = lines[i];
                                    if (textY < (height - f.y - f.h) + 2) break; // don't draw below field

                                    // Measure text width for alignment
                                    let textWidth = 0;
                                    try {
                                        textWidth = Math.min(font.widthOfTextAtSize(line, fontSize), maxW);
                                    } catch (_) {
                                        textWidth = Math.min(line.length * fontSize * 0.5, maxW);
                                    }

                                    let drawX = x + 3; // left
                                    if (align === 'right') {
                                        drawX = x + f.w - textWidth - 3;
                                    } else if (align === 'center') {
                                        drawX = x + (f.w - textWidth) / 2;
                                    }
                                    drawX = Math.max(x + 1, drawX);

                                    try {
                                        page.drawText(line, {
                                            x: drawX,
                                            y: textY,
                                            size: fontSize,
                                            font: font,
                                            color: textColor,
                                            maxWidth: maxW
                                        });
                                    } catch (textErr) {
                                        try {
                                            page.drawText(line, {
                                                x: drawX,
                                                y: textY,
                                                size: fontSize,
                                                font: fallbackFont,
                                                color: textColor,
                                                maxWidth: maxW
                                            });
                                        } catch (e2) { /* skip problematic line */ }
                                    }

                                    // Underline
                                    if (f.underline && line.trim()) {
                                        try {
                                            page.drawLine({
                                                start: { x: drawX, y: textY - 1.5 },
                                                end:   { x: drawX + textWidth, y: textY - 1.5 },
                                                thickness: Math.max(0.6, fontSize * 0.06),
                                                color: textColor
                                            });
                                        } catch (_) {}
                                    }

                                    // Bold simulation: draw a second time slightly offset
                                    if (f.bold) {
                                        try {
                                            page.drawText(line, {
                                                x: drawX + 0.4,
                                                y: textY,
                                                size: fontSize,
                                                font: font,
                                                color: textColor,
                                                maxWidth: maxW
                                            });
                                        } catch (_) {}
                                    }

                                    textY -= lineHeight;
                                }
                            }
                        } else if (f.type === 'checkbox') {
                            const size = Math.min(f.w, f.h);
                            page.drawRectangle({
                                x: x,
                                y: y,
                                width: size,
                                height: size,
                                borderColor: PDFLib.rgb(0, 0, 0),
                                borderWidth: 1.2,
                                color: PDFLib.rgb(1, 1, 1)
                            });
                            if (f.value === true) {
                                // Draw a proper checkmark
                                const pad = size * 0.22;
                                const thickness = Math.max(1.5, size * 0.12);
                                // Short arm
                                page.drawLine({
                                    start: { x: x + pad, y: y + size * 0.45 },
                                    end:   { x: x + size * 0.42, y: y + pad },
                                    thickness: thickness,
                                    color: PDFLib.rgb(0, 0.45, 0.1)
                                });
                                // Long arm
                                page.drawLine({
                                    start: { x: x + size * 0.40, y: y + pad },
                                    end:   { x: x + size - pad, y: y + size - pad },
                                    thickness: thickness,
                                    color: PDFLib.rgb(0, 0.45, 0.1)
                                });
                            }
                        } else if (f.type === 'signature' && f.value) {
                            try {
                                // All signatures are normalized to PNG data-URLs
                                const imgBytes = await fetch(f.value).then(res => res.arrayBuffer());
                                const embeddedImage = await newDoc.embedPng(imgBytes);
                                page.drawImage(embeddedImage, {
                                    x: x,
                                    y: y,
                                    width: f.w,
                                    height: f.h
                                });
                            } catch (err) {
                                console.warn('Signature embed error:', err);
                                // Last-resort: try JPG
                                try {
                                    const imgBytes = await fetch(f.value).then(res => res.arrayBuffer());
                                    const embeddedImage = await newDoc.embedJpg(imgBytes);
                                    page.drawImage(embeddedImage, { x: x, y: y, width: f.w, height: f.h });
                                } catch (e2) {
                                    console.warn('Signature fallback also failed', e2);
                                }
                            }
                        }
                    }

                    const pdfBytes = await newDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'edited_document.pdf';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 8000);
                    showToast('💾 הורדה הושלמה');
                } catch (err) {
                    showToast('❌ שגיאה: ' + err.message);
                    console.error(err);
                }
            });

            // ===== File inputs =====
            pdfUpload.addEventListener('change', function() {
                if (this.files && this.files[0]) loadPdfFile(this.files[0]);
            });
            sigUpload.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    loadSignatureFile(this.files[0]);
                }
            });

            // ===== Drag & drop on upload cards =====
            document.querySelectorAll('.upload-card').forEach(card => {
                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    card.style.borderColor = '#0d6efd';
                });
                card.addEventListener('dragleave', () => {
                    card.style.borderColor = '#d0d0d0';
                });
                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    card.style.borderColor = '#d0d0d0';
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        const f = files[0];
                        const isSvg = f.type === 'image/svg+xml' || f.name.toLowerCase().endsWith('.svg');
                        if (f.type === 'application/pdf') {
                            loadPdfFile(f);
                            pdfFileName.textContent = f.name;
                        } else if (f.type.startsWith('image/') || isSvg) {
                            loadSignatureFile(f);
                        }
                    }
                });
            });

            // Handle window resize - re-render pages for better fit
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (pdfDoc) {
                        // Keep fields, just re-render pages at new scale
                        renderAllPages();
                    }
                }, 350);
            });

            // Init
            updatePageNav();
            showToast('📄 העלה PDF והתחל', 3500);
            console.log('✅ עורך PDF מתקדם (גרסה משופרת) טעון');
        })();
    </script>
</body>
</html>
