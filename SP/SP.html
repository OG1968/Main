    <script>
        (function() {
            'use strict';

            // ===== PDF.js Worker =====
            if (typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }

            // ===== State =====
            let pdfDoc = null;
            let pdfDataArrayBuffer = null;
            let currentPage = 1;
            let totalPages = 0;
            let baseScale = 1.5;
            let zoomMultiplier = 1.0;

            let fields = [];
            let fieldIdCounter = 0;
            let selectedTool = 'signature';
            let selectedFieldId = null;
            let signatureImageData = null;

            // ===== Undo / Redo =====
            let undoStack = [];
            let redoStack = [];
            const MAX_UNDO = 50;

            function snapshotState() {
                return JSON.stringify(fields);
            }

            function pushUndo() {
                undoStack.push(snapshotState());
                if (undoStack.length > MAX_UNDO) undoStack.shift();
                redoStack = [];
                updateUndoRedoButtons();
            }

            function restoreState(snap) {
                fields = JSON.parse(snap);
                if (fields.length > 0) {
                    fieldIdCounter = Math.max(...fields.map(f => f.id)) + 1;
                }
                selectedFieldId = null;
                renderFields();
            }

            function undo() {
                if (undoStack.length === 0) return;
                redoStack.push(snapshotState());
                const snap = undoStack.pop();
                restoreState(snap);
                updateUndoRedoButtons();
                showToast('↩️ בוטל');
            }

            function redo() {
                if (redoStack.length === 0) return;
                undoStack.push(snapshotState());
                const snap = redoStack.pop();
                restoreState(snap);
                updateUndoRedoButtons();
                showToast('↪️ חזר');
            }

            function updateUndoRedoButtons() {
                document.getElementById('undoBtn').disabled = undoStack.length === 0;
                document.getElementById('redoBtn').disabled = redoStack.length === 0;
            }

            // ===== Theme =====
            const themeSelect = document.getElementById('themeSelect');
            themeSelect.addEventListener('change', function() {
                const val = this.value;
                if (val === 'default') {
                    document.documentElement.removeAttribute('data-theme');
                } else {
                    document.documentElement.setAttribute('data-theme', val);
                }
                try { localStorage.setItem('pdf-editor-theme', val); } catch(_) {}
            });
            try {
                const savedTheme = localStorage.getItem('pdf-editor-theme');
                if (savedTheme && savedTheme !== 'default') {
                    themeSelect.value = savedTheme;
                    document.documentElement.setAttribute('data-theme', savedTheme);
                }
            } catch(_) {}

            // ===== Hebrew detection =====
            function isPrimarilyHebrew(text) {
                if (!text || !text.trim()) return true;
                const hebrew = (text.match(/[\u0590-\u05FF]/g) || []).join('').length;
                const latin = (text.match(/[A-Za-z]/g) || []).join('').length;
                if (hebrew === 0 && latin === 0) return true;
                return hebrew >= latin;
            }

            // ===== Split text into Hebrew / Latin runs for dual-font drawing =====
            function splitScriptRuns(text) {
                const runs = [];
                let current = '';
                let currentIsHeb = null;
                for (const ch of text) {
                    const isHeb = /[\u0590-\u05FF]/.test(ch);
                    const isLatin = /[A-Za-z0-9]/.test(ch);
                    const kind = isHeb ? true : (isLatin ? false : null);
                    if (currentIsHeb === null) {
                        currentIsHeb = isHeb || (!isLatin ? true : false);
                        current = ch;
                    } else if (kind === null || kind === currentIsHeb) {
                        current += ch;
                    } else {
                        runs.push({ text: current, hebrew: currentIsHeb });
                        current = ch;
                        currentIsHeb = isHeb;
                    }
                }
                if (current) runs.push({ text: current, hebrew: currentIsHeb !== false });
                return runs;
            }

            // ===== Drag / Resize state =====
            let isDragging = false;
            let dragTarget = null;
            let dragOffsetX = 0, dragOffsetY = 0;
            let isResizing = false;
            let resizeTarget = null;
            let resizeStartX = 0, resizeStartY = 0;
            let resizeStartW = 0, resizeStartH = 0;
            let resizeScale = 1;

            let pageWidths = [];
            let pageHeights = [];
            let renderedPages = new Set();
            let pageRenderScale = [];

            let touchDragData = null;
            let touchResizeData = null;

            const container = document.getElementById('pdfContainer');
            const pagesContainer = document.getElementById('pagesContainer');
            const pdfUpload = document.getElementById('pdfUpload');
            const sigUpload = document.getElementById('sigUpload');
            const pdfFileName = document.getElementById('pdfFileName');
            const sigStatus = document.getElementById('sigStatus');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearPdfBtn = document.getElementById('clearPdfBtn');
            const clearSigBtn = document.getElementById('clearSigBtn');
            const deleteAllBtn = document.getElementById('deleteAllBtn');
            const pageNumDisplay = document.getElementById('pageNumDisplay');
            const prevPage = document.getElementById('prevPage');
            const nextPage = document.getElementById('nextPage');
            const toastEl = document.getElementById('toast');
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');
            const zoomInBtn = document.getElementById('zoomIn');
            const zoomOutBtn = document.getElementById('zoomOut');
            const zoomResetBtn = document.getElementById('zoomReset');
            const zoomLevelEl = document.getElementById('zoomLevel');

            function showToast(msg, duration = 2800) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastEl._timeout);
                toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), duration);
            }

            function getPageWrapper(pageNum) {
                return document.querySelector(`.pdf-page-wrapper[data-page="${pageNum}"]`);
            }

            function getPageCanvas(pageNum) {
                const wrapper = getPageWrapper(pageNum);
                return wrapper ? wrapper.querySelector('canvas') : null;
            }

            function getFieldElement(id) {
                return document.querySelector(`.field-overlay[data-field-id="${id}"]`);
            }

            // ===== File size validation =====
            const MAX_PDF_SIZE = 50 * 1024 * 1024; // 50 MB

            // ===== Load PDF =====
            function loadPdfFile(file) {
                if (file.size > MAX_PDF_SIZE) {
                    showToast('❌ הקובץ גדול מדי (מקסימום 50MB)');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    pdfDataArrayBuffer = e.target.result;
                    const bufferForPdfjs = pdfDataArrayBuffer.slice(0);
                    pdfFileName.textContent = file.name;

                    pdfjsLib.getDocument({
                        data: bufferForPdfjs,
                        cMapUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/cmaps/',
                        cMapPacked: true,
                        standardFontDataUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/standard_fonts/',
                        useSystemFonts: true,
                        disableFontFace: false
                    }).promise.then(doc => {
                        pdfDoc = doc;
                        totalPages = doc.numPages;
                        currentPage = 1;
                        fields = [];
                        fieldIdCounter = 0;
                        selectedFieldId = null;
                        undoStack = [];
                        redoStack = [];
                        updateUndoRedoButtons();
                        pageWidths = [];
                        pageHeights = [];
                        renderedPages = new Set();
                        pageRenderScale = [];
                        renderAllPages();
                        showToast('✅ PDF נטען בהצלחה');
                    }).catch(err => {
                        showToast('❌ שגיאה: ' + err.message);
                        console.error(err);
                    });
                };
                reader.readAsArrayBuffer(file);
            }

            // ===== Convert any image to PNG data-URL =====
            function imageFileToPngDataUrl(file) {
                return new Promise((resolve, reject) => {
                    const isSvg = file.type === 'image/svg+xml' ||
                                  file.name.toLowerCase().endsWith('.svg');

                    if (isSvg) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const svgText = e.target.result;
                            const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
                            const url = URL.createObjectURL(blob);
                            const img = new Image();
                            img.onload = function() {
                                try {
                                    const w = img.naturalWidth || img.width || 400;
                                    const h = img.naturalHeight || img.height || 200;
                                    const canvas = document.createElement('canvas');
                                    const scaleFactor = 2;
                                    canvas.width = w * scaleFactor;
                                    canvas.height = h * scaleFactor;
                                    const ctx = canvas.getContext('2d');
                                    ctx.scale(scaleFactor, scaleFactor);
                                    ctx.drawImage(img, 0, 0, w, h);
                                    const pngDataUrl = canvas.toDataURL('image/png');
                                    URL.revokeObjectURL(url);
                                    resolve(pngDataUrl);
                                } catch (err) {
                                    URL.revokeObjectURL(url);
                                    reject(err);
                                }
                            };
                            img.onerror = function() {
                                URL.revokeObjectURL(url);
                                reject(new Error('Failed to load SVG'));
                            };
                            img.src = url;
                        };
                        reader.onerror = () => reject(new Error('Failed to read SVG file'));
                        reader.readAsText(file);
                    } else {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const dataUrl = e.target.result;
                            if (file.type === 'image/png' || dataUrl.startsWith('data:image/png')) {
                                resolve(dataUrl);
                                return;
                            }
                            const img = new Image();
                            img.onload = function() {
                                try {
                                    const canvas = document.createElement('canvas');
                                    canvas.width = img.naturalWidth || img.width;
                                    canvas.height = img.naturalHeight || img.height;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(img, 0, 0);
                                    resolve(canvas.toDataURL('image/png'));
                                } catch (err) {
                                    resolve(dataUrl);
                                }
                            };
                            img.onerror = () => resolve(dataUrl);
                            img.src = dataUrl;
                        };
                        reader.onerror = () => reject(new Error('Failed to read image file'));
                        reader.readAsDataURL(file);
                    }
                });
            }

            // ===== Load Signature =====
            async function loadSignatureFile(file) {
                try {
                    showToast('⏳ מעבד חתימה...');
                    const dataUrl = await imageFileToPngDataUrl(file);
                    signatureImageData = dataUrl;
                    sigStatus.textContent = '✅ חתימה נטענה';
                    showToast('✅ חתימה נטענה' + (file.name.toLowerCase().endsWith('.svg') ? ' (SVG→PNG)' : ''));
                    fields.forEach(f => {
                        if (f.type === 'signature' && !f.value) {
                            f.value = signatureImageData;
                        }
                    });
                    renderFields();
                } catch (err) {
                    console.error(err);
                    showToast('❌ שגיאה בטעינת חתימה: ' + err.message);
                }
            }

            // ===== Get current effective scale =====
            function getEffectiveScale() {
                return baseScale * zoomMultiplier;
            }

            // ===== Render all pages (with lazy rendering) =====
            async function renderAllPages() {
                if (!pdfDoc) return;
                pagesContainer.innerHTML = '';
                pageWidths = [];
                pageHeights = [];
                pageRenderScale = [];
                renderedPages = new Set();

                const containerWidth = Math.max(280, container.clientWidth - 24);

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1 });
                    const width = viewport.width;
                    const height = viewport.height;
                    pageWidths.push(width);
                    pageHeights.push(height);

                    let idealScale = containerWidth / width;
                    idealScale = Math.min(2.2, Math.max(0.45, idealScale));
                    baseScale = idealScale;
                    pageRenderScale.push(idealScale);

                    const effScale = idealScale * zoomMultiplier;
                    const scaledViewport = page.getViewport({ scale: effScale });
                    const wrapper = document.createElement('div');
                    wrapper.className = 'pdf-page-wrapper loading';
                    wrapper.dataset.page = i;
                    wrapper.dir = 'ltr';
                    wrapper.style.position = 'relative';
                    wrapper.style.width = scaledViewport.width + 'px';
                    wrapper.style.margin = '0 auto 12px auto';
                    wrapper.style.maxWidth = '100%';
                    wrapper.style.direction = 'ltr';
                    wrapper.style.minHeight = scaledViewport.height + 'px';

                    const canvas = document.createElement('canvas');
                    canvas.width = scaledViewport.width;
                    canvas.height = scaledViewport.height;
                    canvas.dir = 'ltr';
                    canvas.style.display = 'block';
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';
                    canvas.style.direction = 'ltr';

                    wrapper.appendChild(canvas);
                    pagesContainer.appendChild(wrapper);
                }

                // Lazy render: only visible pages first, then rest
                renderVisiblePages();
                // Render remaining pages after a short delay
                setTimeout(() => renderRemainingPages(), 100);

                renderFields();
                updatePageNav();
                updateZoomDisplay();
            }

            async function renderVisiblePages() {
                const containerRect = container.getBoundingClientRect();
                for (let i = 1; i <= totalPages; i++) {
                    if (renderedPages.has(i)) continue;
                    const wrapper = getPageWrapper(i);
                    if (!wrapper) continue;
                    const rect = wrapper.getBoundingClientRect();
                    const isVisible = rect.bottom > containerRect.top - 200 && rect.top < containerRect.bottom + 200;
                    if (isVisible) {
                        await renderPage(i);
                    }
                }
            }

            async function renderRemainingPages() {
                for (let i = 1; i <= totalPages; i++) {
                    if (!renderedPages.has(i)) {
                        await renderPage(i);
                        renderFields();
                    }
                }
            }

            async function renderPage(pageNum) {
                if (!pdfDoc || renderedPages.has(pageNum)) return;
                const page = await pdfDoc.getPage(pageNum);
                const effScale = pageRenderScale[pageNum - 1] * zoomMultiplier;
                const scaledViewport = page.getViewport({ scale: effScale });
                const wrapper = getPageWrapper(pageNum);
                if (!wrapper) return;
                const canvas = wrapper.querySelector('canvas');
                if (!canvas) return;

                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;
                wrapper.style.width = scaledViewport.width + 'px';
                wrapper.style.minHeight = scaledViewport.height + 'px';

                const renderContext = {
                    canvasContext: canvas.getContext('2d'),
                    viewport: scaledViewport
                };
                await page.render(renderContext).promise;
                renderedPages.add(pageNum);
                wrapper.classList.remove('loading');
            }

            // ===== Re-render pages on zoom change =====
            async function reRenderPages() {
                if (!pdfDoc) return;
                renderedPages = new Set();
                for (let i = 1; i <= totalPages; i++) {
                    const wrapper = getPageWrapper(i);
                    if (!wrapper) continue;
                    const effScale = pageRenderScale[i - 1] * zoomMultiplier;
                    const page = await pdfDoc.getPage(i);
                    const scaledViewport = page.getViewport({ scale: effScale });
                    const canvas = wrapper.querySelector('canvas');
                    if (!canvas) continue;
                    canvas.width = scaledViewport.width;
                    canvas.height = scaledViewport.height;
                    wrapper.style.width = scaledViewport.width + 'px';
                    wrapper.style.minHeight = scaledViewport.height + 'px';
                    wrapper.classList.add('loading');
                    const renderContext = {
                        canvasContext: canvas.getContext('2d'),
                        viewport: scaledViewport
                    };
                    await page.render(renderContext).promise;
                    renderedPages.add(i);
                    wrapper.classList.remove('loading');
                }
                renderFields();
            }

            // ===== Add field =====
            function addField(pageNum, x, y) {
                if (!selectedTool || selectedTool === 'cursor') {
                    showToast('ℹ️ בחר כלי תחילה');
                    return;
                }

                pushUndo();

                const pageIndex = pageNum - 1;
                const field = {
                    id: fieldIdCounter++,
                    type: selectedTool,
                    pageIndex: pageIndex,
                    x: x,
                    y: y,
                    w: 140,
                    h: 30,
                    value: '',
                    fontSize: 14,
                    color: '#1a1a1a',
                    bold: false,
                    underline: false,
                    align: 'right'
                };

                if (selectedTool === 'signature') {
                    field.w = 160;
                    field.h = 60;
                    field.value = signatureImageData || '';
                } else if (selectedTool === 'checkbox') {
                    field.w = 14;
                    field.h = 14;
                    field.value = false;
                } else if (selectedTool === 'text') {
                    field.w = 200;
                    field.h = 55;
                    field.value = '';
                    field.fontSize = 14;
                    field.color = '#1a1a1a';
                    field.bold = false;
                    field.underline = false;
                    field.align = 'right';
                    field.alignLocked = false;
                }

                field.x = Math.max(0, Math.min(field.x, pageWidths[pageIndex] - field.w));
                field.y = Math.max(0, Math.min(field.y, pageHeights[pageIndex] - field.h));

                fields.push(field);
                selectedFieldId = field.id;
                selectedTool = null;
                document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                renderFields();
                showToast('✅ שדה נוסף – לחץ על הכלי שוב להוספה נוספת');
            }

            // ===== Render fields =====
            function renderFields() {
                document.querySelectorAll('.field-overlay').forEach(el => el.remove());

                for (const f of fields) {
                    const pageNum = f.pageIndex + 1;
                    const wrapper = getPageWrapper(pageNum);
                    if (!wrapper) continue;
                    const canvas = wrapper.querySelector('canvas');
                    if (!canvas) continue;

                    const s = canvas.width / pageWidths[f.pageIndex];
                    const relX = f.x * s;
                    const relY = f.y * s;
                    const relW = f.w * s;
                    const relH = f.h * s;

                    const el = document.createElement('div');
                    el.className = 'field-overlay';
                    if (f.type === 'text') el.classList.add('text-field');
                    if (f.type === 'checkbox') el.classList.add('checkbox-field');
                    if (selectedFieldId === f.id) el.classList.add('selected');
                    el.dataset.fieldId = f.id;
                    el.style.left = relX + 'px';
                    el.style.top = relY + 'px';
                    el.style.width = relW + 'px';
                    el.style.height = relH + 'px';

                    const label = document.createElement('div');
                    label.className = 'field-label';
                    const labels = { text: 'טקסט', signature: 'חתימה', checkbox: 'סימון' };
                    label.textContent = labels[f.type] || f.type;
                    el.appendChild(label);

                    if (f.type === 'text') {
                        const align = f.align || 'right';
                        const toolbar = document.createElement('div');
                        toolbar.className = 'text-toolbar';
                        toolbar.innerHTML = `
                            <button type="button" class="tt-btn tt-dec" title="הקטן גופן">A−</button>
                            <span class="tt-size">${f.fontSize || 14}</span>
                            <button type="button" class="tt-btn tt-inc" title="הגדל גופן">A+</button>
                            <input type="color" class="tt-color" value="${f.color || '#1a1a1a'}" title="צבע">
                            <button type="button" class="tt-btn tt-bold ${f.bold ? 'active' : ''}" title="הדגשה"><b>B</b></button>
                            <button type="button" class="tt-btn tt-underline ${f.underline ? 'active' : ''}" title="קו תחתון"><u>U</u></button>
                            <button type="button" class="tt-btn tt-align-right ${align === 'right' ? 'active' : ''}" title="ישור לימין">▶|</button>
                            <button type="button" class="tt-btn tt-align-center ${align === 'center' ? 'active' : ''}" title="ישור למרכז">|▶|</button>
                            <button type="button" class="tt-btn tt-align-left ${align === 'left' ? 'active' : ''}" title="ישור לשמאל">|◀</button>
                        `;
                        toolbar.addEventListener('mousedown', (e) => e.stopPropagation());
                        toolbar.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
                        toolbar.addEventListener('click', (e) => e.stopPropagation());

                        const ta = document.createElement('textarea');
                        ta.value = f.value || '';
                        ta.placeholder = 'הקלד טקסט...';
                        ta.style.fontSize = (f.fontSize || 14) + 'px';
                        ta.style.color = f.color || '#1a1a1a';
                        ta.style.fontWeight = f.bold ? 'bold' : 'normal';
                        ta.style.textDecoration = f.underline ? 'underline' : 'none';
                        ta.style.textAlign = align;
                        const heb = isPrimarilyHebrew(f.value || '');
                        ta.style.direction = heb ? 'rtl' : 'ltr';
                        ta.addEventListener('input', (e) => {
                            f.value = e.target.value;
                            if (!f.alignLocked) {
                                const primarilyHeb = isPrimarilyHebrew(f.value);
                                const newAlign = primarilyHeb ? 'right' : 'left';
                                f.align = newAlign;
                                ta.style.textAlign = newAlign;
                                ta.style.direction = primarilyHeb ? 'rtl' : 'ltr';
                                toolbar.querySelector('.tt-align-right').classList.toggle('active', newAlign === 'right');
                                toolbar.querySelector('.tt-align-center').classList.toggle('active', false);
                                toolbar.querySelector('.tt-align-left').classList.toggle('active', newAlign === 'left');
                            } else {
                                ta.style.direction = isPrimarilyHebrew(f.value) ? 'rtl' : 'ltr';
                            }
                            const lineCount = Math.max(1, (f.value || '').split('\n').length);
                            const neededH = Math.max(28, lineCount * (f.fontSize || 14) * 1.4 + 8);
                            if (neededH > f.h) {
                                const maxH = pageHeights[f.pageIndex] - f.y;
                                f.h = Math.min(neededH, maxH);
                                el.style.height = (f.h * s) + 'px';
                            }
                        });
                        ta.addEventListener('blur', () => {
                            pushUndo();
                        });
                        ta.addEventListener('mousedown', (e) => e.stopPropagation());
                        ta.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
                        ta.addEventListener('click', (e) => e.stopPropagation());
                        ta.readOnly = selectedFieldId !== f.id;

                        toolbar.querySelector('.tt-dec').addEventListener('click', (e) => {
                            e.stopPropagation();
                            f.fontSize = Math.max(8, (f.fontSize || 14) - 1);
                            ta.style.fontSize = f.fontSize + 'px';
                            toolbar.querySelector('.tt-size').textContent = f.fontSize;
                        });
                        toolbar.querySelector('.tt-inc').addEventListener('click', (e) => {
                            e.stopPropagation();
                            f.fontSize = Math.min(48, (f.fontSize || 14) + 1);
                            ta.style.fontSize = f.fontSize + 'px';
                            toolbar.querySelector('.tt-size').textContent = f.fontSize;
                        });
                        toolbar.querySelector('.tt-color').addEventListener('input', (e) => {
                            e.stopPropagation();
                            f.color = e.target.value;
                            ta.style.color = f.color;
                        });
                        toolbar.querySelector('.tt-bold').addEventListener('click', (e) => {
                            e.stopPropagation();
                            f.bold = !f.bold;
                            ta.style.fontWeight = f.bold ? 'bold' : 'normal';
                            e.currentTarget.classList.toggle('active', f.bold);
                        });
                        toolbar.querySelector('.tt-underline').addEventListener('click', (e) => {
                            e.stopPropagation();
                            f.underline = !f.underline;
                            ta.style.textDecoration = f.underline ? 'underline' : 'none';
                            e.currentTarget.classList.toggle('active', f.underline);
                        });

                        function setAlign(newAlign) {
                            f.align = newAlign;
                            f.alignLocked = true;
                            ta.style.textAlign = newAlign;
                            toolbar.querySelector('.tt-align-right').classList.toggle('active', newAlign === 'right');
                            toolbar.querySelector('.tt-align-center').classList.toggle('active', newAlign === 'center');
                            toolbar.querySelector('.tt-align-left').classList.toggle('active', newAlign === 'left');
                        }
                        toolbar.querySelector('.tt-align-right').addEventListener('click', (e) => {
                            e.stopPropagation();
                            setAlign('right');
                        });
                        toolbar.querySelector('.tt-align-center').addEventListener('click', (e) => {
                            e.stopPropagation();
                            setAlign('center');
                        });
                        toolbar.querySelector('.tt-align-left').addEventListener('click', (e) => {
                            e.stopPropagation();
                            setAlign('left');
                        });

                        el.appendChild(toolbar);
                        el.appendChild(ta);
                    } else if (f.type === 'checkbox') {
                        const span = document.createElement('span');
                        span.className = 'checkbox-mark';
                        const size = Math.min(f.w, f.h);
                        const fontSize = Math.max(8, Math.min(18, size * 0.9));
                        span.style.fontSize = fontSize + 'px';
                        span.textContent = f.value ? '☑' : '☐';
                        span.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (selectedFieldId !== f.id) {
                                selectedFieldId = f.id;
                                renderFields();
                                return;
                            }
                            pushUndo();
                            f.value = !f.value;
                            span.textContent = f.value ? '☑' : '☐';
                        });
                        el.appendChild(span);
                    } else if (f.type === 'signature') {
                        if (f.value) {
                            const img = document.createElement('img');
                            img.src = f.value;
                            el.appendChild(img);
                        } else {
                            const span = document.createElement('span');
                            span.className = 'signature-placeholder';
                            span.textContent = '✍️ חתימה';
                            el.appendChild(span);
                        }
                    }

                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-handle';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        pushUndo();
                        fields = fields.filter(field => field.id !== f.id);
                        if (selectedFieldId === f.id) selectedFieldId = null;
                        renderFields();
                        showToast('🗑️ שדה נמחק');
                    });
                    el.appendChild(delBtn);

                    const resizeHandle = document.createElement('div');
                    resizeHandle.className = 'resize-handle';
                    resizeHandle.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        if (selectedFieldId !== f.id) return;
                        startResize(e, f);
                    });
                    resizeHandle.addEventListener('touchstart', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        if (selectedFieldId !== f.id) return;
                        startResizeTouch(e, f);
                    }, { passive: false });
                    el.appendChild(resizeHandle);

                    el.addEventListener('mousedown', (e) => {
                        if (e.target === delBtn || e.target === resizeHandle) return;
                        if (f.type === 'text' && e.target.tagName === 'TEXTAREA' && selectedFieldId === f.id) return;
                        if (selectedFieldId !== f.id) {
                            selectedFieldId = f.id;
                            renderFields();
                            return;
                        }
                        if (f.type === 'text' && e.target.tagName === 'TEXTAREA') return;
                        startDrag(e, f);
                    });
                    el.addEventListener('touchstart', (e) => {
                        if (e.target === delBtn || e.target === resizeHandle) return;
                        if (f.type === 'text' && e.target.tagName === 'TEXTAREA' && selectedFieldId === f.id) return;
                        if (selectedFieldId !== f.id) {
                            selectedFieldId = f.id;
                            renderFields();
                            return;
                        }
                        if (f.type === 'text' && e.target.tagName === 'TEXTAREA') return;
                        startDragTouch(e, f);
                    }, { passive: false });

                    wrapper.appendChild(el);
                }
            }

            // ===== Drag =====
            function startDrag(e, field) {
                isDragging = true;
                dragTarget = field;
                const el = e.target.closest('.field-overlay');
                const rect = el.getBoundingClientRect();
                dragOffsetX = e.clientX - rect.left;
                dragOffsetY = e.clientY - rect.top;
                el.style.cursor = 'grabbing';
                e.preventDefault();
            }

            function onDragMove(e) {
                if (!isDragging || !dragTarget) return;
                const pageNum = dragTarget.pageIndex + 1;
                const canvas = getPageCanvas(pageNum);
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const s = canvas.width / pageWidths[dragTarget.pageIndex];

                let newX = (e.clientX - rect.left - dragOffsetX) / s;
                let newY = (e.clientY - rect.top - dragOffsetY) / s;
                newX = Math.max(0, Math.min(newX, pageWidths[dragTarget.pageIndex] - dragTarget.w));
                newY = Math.max(0, Math.min(newY, pageHeights[dragTarget.pageIndex] - dragTarget.h));

                dragTarget.x = newX;
                dragTarget.y = newY;

                const el = getFieldElement(dragTarget.id);
                if (el) {
                    el.style.left = (newX * s) + 'px';
                    el.style.top  = (newY * s) + 'px';
                }
            }

            function onDragEnd() {
                if (isDragging) {
                    isDragging = false;
                    dragTarget = null;
                    document.querySelectorAll('.field-overlay').forEach(el => el.style.cursor = 'grab');
                }
            }

            function startDragTouch(e, field) {
                const touch = e.touches[0];
                const el = e.target.closest('.field-overlay');
                const rect = el.getBoundingClientRect();
                touchDragData = {
                    field,
                    offsetX: touch.clientX - rect.left,
                    offsetY: touch.clientY - rect.top
                };
                e.preventDefault();
            }

            // ===== Resize =====
            function startResize(e, field) {
                isResizing = true;
                resizeTarget = field;
                resizeStartX = e.clientX;
                resizeStartY = e.clientY;
                resizeStartW = field.w;
                resizeStartH = field.h;
                const canvas = getPageCanvas(field.pageIndex + 1);
                resizeScale = canvas ? (canvas.width / pageWidths[field.pageIndex]) : 1;
                e.preventDefault();
            }

            function onResizeMove(e) {
                if (!isResizing || !resizeTarget) return;
                const dx = (e.clientX - resizeStartX) / resizeScale;
                const dy = (e.clientY - resizeStartY) / resizeScale;
                const minSize = resizeTarget.type === 'checkbox' ? 12 : 28;
                const newW = Math.max(minSize, resizeStartW + dx);
                const newH = Math.max(minSize, resizeStartH + dy);

                const maxW = pageWidths[resizeTarget.pageIndex] - resizeTarget.x;
                const maxH = pageHeights[resizeTarget.pageIndex] - resizeTarget.y;
                resizeTarget.w = Math.min(newW, maxW);
                resizeTarget.h = Math.min(newH, maxH);

                const el = getFieldElement(resizeTarget.id);
                if (el) {
                    el.style.width  = (resizeTarget.w * resizeScale) + 'px';
                    el.style.height = (resizeTarget.h * resizeScale) + 'px';
                    if (resizeTarget.type === 'checkbox') {
                        const span = el.querySelector('.checkbox-mark');
                        if (span) {
                            const size = Math.min(resizeTarget.w, resizeTarget.h);
                            span.style.fontSize = Math.max(10, Math.min(22, size * 0.85)) + 'px';
                        }
                    }
                }
            }

            function onResizeEnd() {
                if (isResizing) {
                    isResizing = false;
                    resizeTarget = null;
                }
            }

            function startResizeTouch(e, field) {
                const touch = e.touches[0];
                const canvas = getPageCanvas(field.pageIndex + 1);
                const s = canvas ? (canvas.width / pageWidths[field.pageIndex]) : 1;
                touchResizeData = {
                    field,
                    startX: touch.clientX,
                    startY: touch.clientY,
                    startW: field.w,
                    startH: field.h,
                    scale: s
                };
                e.preventDefault();
            }

            // ===== Global pointer / touch handlers =====
            document.addEventListener('mousemove', (e) => {
                onDragMove(e);
                onResizeMove(e);
            });
            document.addEventListener('mouseup', () => {
                onDragEnd();
                onResizeEnd();
            });

            document.addEventListener('touchmove', (e) => {
                if (touchDragData) {
                    const touch = e.touches[0];
                    const field = touchDragData.field;
                    const pageNum = field.pageIndex + 1;
                    const canvas = getPageCanvas(pageNum);
                    if (!canvas) return;
                    const rect = canvas.getBoundingClientRect();
                    const s = canvas.width / pageWidths[field.pageIndex];

                    let newX = (touch.clientX - rect.left - touchDragData.offsetX) / s;
                    let newY = (touch.clientY - rect.top - touchDragData.offsetY) / s;
                    newX = Math.max(0, Math.min(newX, pageWidths[field.pageIndex] - field.w));
                    newY = Math.max(0, Math.min(newY, pageHeights[field.pageIndex] - field.h));
                    field.x = newX;
                    field.y = newY;

                    const el = getFieldElement(field.id);
                    if (el) {
                        el.style.left = (newX * s) + 'px';
                        el.style.top  = (newY * s) + 'px';
                    }
                    e.preventDefault();
                } else if (touchResizeData) {
                    const touch = e.touches[0];
                    const { field, startX, startY, startW, startH, scale: s } = touchResizeData;
                    const dx = (touch.clientX - startX) / s;
                    const dy = (touch.clientY - startY) / s;
                    const minSize = field.type === 'checkbox' ? 12 : 28;
                    let newW = Math.max(minSize, startW + dx);
                    let newH = Math.max(minSize, startH + dy);
                    newW = Math.min(newW, pageWidths[field.pageIndex] - field.x);
                    newH = Math.min(newH, pageHeights[field.pageIndex] - field.y);
                    field.w = newW;
                    field.h = newH;

                    const el = getFieldElement(field.id);
                    if (el) {
                        el.style.width  = (newW * s) + 'px';
                        el.style.height = (newH * s) + 'px';
                        if (field.type === 'checkbox') {
                            const span = el.querySelector('.checkbox-mark');
                            if (span) {
                                const size = Math.min(newW, newH);
                                span.style.fontSize = Math.max(10, Math.min(22, size * 0.85)) + 'px';
                            }
                        }
                    }
                    e.preventDefault();
                }
            }, { passive: false });

            document.addEventListener('touchend', () => {
                touchDragData = null;
                touchResizeData = null;
            });
            document.addEventListener('touchcancel', () => {
                touchDragData = null;
                touchResizeData = null;
            });

            // ===== Click on page: add field or deselect =====
            pagesContainer.addEventListener('click', function(e) {
                if (e.target.closest('.field-overlay')) return;
                if (e.target.closest('textarea')) return;

                if (selectedFieldId !== null) {
                    selectedFieldId = null;
                    renderFields();
                }

                if (!selectedTool) return;

                const wrapper = e.target.closest('.pdf-page-wrapper');
                if (!wrapper) return;
                const canvas = wrapper.querySelector('canvas');
                if (!canvas) return;
                const pageNum = parseInt(wrapper.dataset.page, 10);
                const rect = canvas.getBoundingClientRect();
                const s = canvas.width / pageWidths[pageNum - 1];

                const x = (e.clientX - rect.left) / s;
                const y = (e.clientY - rect.top) / s;
                addField(pageNum, x, y);
            });

            // ===== Tool selection =====
            document.querySelectorAll('[data-tool]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedTool = this.dataset.tool;
                    showToast('🔧 כלי: ' + this.textContent.trim());
                });
            });

            // ===== Page navigation =====
            function updatePageNav() {
                pageNumDisplay.textContent = `${currentPage} / ${totalPages || 1}`;
                prevPage.disabled = currentPage <= 1;
                nextPage.disabled = currentPage >= totalPages;
            }

            function goToPage(pageNum) {
                if (pageNum < 1 || pageNum > totalPages) return;
                currentPage = pageNum;
                updatePageNav();
                const wrapper = getPageWrapper(pageNum);
                if (wrapper) {
                    wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            prevPage.addEventListener('click', () => goToPage(currentPage - 1));
            nextPage.addEventListener('click', () => goToPage(currentPage + 1));

            // ===== Zoom =====
            function updateZoomDisplay() {
                zoomLevelEl.textContent = Math.round(zoomMultiplier * 100) + '%';
            }

            zoomInBtn.addEventListener('click', () => {
                zoomMultiplier = Math.min(3.0, zoomMultiplier + 0.25);
                updateZoomDisplay();
                reRenderPages();
            });
            zoomOutBtn.addEventListener('click', () => {
                zoomMultiplier = Math.max(0.5, zoomMultiplier - 0.25);
                updateZoomDisplay();
                reRenderPages();
            });
            zoomResetBtn.addEventListener('click', () => {
                zoomMultiplier = 1.0;
                updateZoomDisplay();
                reRenderPages();
            });

            // ===== Delete all =====
            deleteAllBtn.addEventListener('click', () => {
                if (fields.length === 0) {
                    showToast('אין שדות למחיקה');
                    return;
                }
                if (confirm('למחוק את כל השדות?')) {
                    pushUndo();
                    fields = [];
                    selectedFieldId = null;
                    renderFields();
                    showToast('🗑️ כל השדות נמחקו');
                }
            });

            // ===== Clear PDF =====
            clearPdfBtn.addEventListener('click', () => {
                pdfDoc = null;
                pdfDataArrayBuffer = null;
                pdfFileName.textContent = 'לא נבחר קובץ';
                pagesContainer.innerHTML = '';
                totalPages = 0;
                currentPage = 1;
                fields = [];
                fieldIdCounter = 0;
                selectedFieldId = null;
                undoStack = [];
                redoStack = [];
                updateUndoRedoButtons();
                pageWidths = [];
                pageHeights = [];
                renderedPages = new Set();
                pageRenderScale = [];
                updatePageNav();
                pdfUpload.value = '';
                showToast('🧹 PDF נוקה');
            });

            // ===== Clear signature =====
            clearSigBtn.addEventListener('click', () => {
                signatureImageData = null;
                sigStatus.textContent = 'לא נטענה';
                sigUpload.value = '';
                fields.forEach(f => {
                    if (f.type === 'signature') f.value = '';
                });
                renderFields();
                showToast('✖️ חתימה הוסרה');
            });

            // ===== Undo / Redo buttons =====
            undoBtn.addEventListener('click', undo);
            redoBtn.addEventListener('click', redo);

            // ===== Keyboard shortcuts =====
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

                if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    undo();
                } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
                    e.preventDefault();
                    redo();
                } else if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (selectedFieldId !== null) {
                        e.preventDefault();
                        pushUndo();
                        fields = fields.filter(f => f.id !== selectedFieldId);
                        selectedFieldId = null;
                        renderFields();
                        showToast('🗑️ שדה נמחק');
                    }
                } else if (selectedFieldId !== null && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                    e.preventDefault();
                    const f = fields.find(fi => fi.id === selectedFieldId);
                    if (!f) return;
                    const step = e.shiftKey ? 10 : 1;
                    if (e.key === 'ArrowLeft') f.x = Math.max(0, f.x - step);
                    else if (e.key === 'ArrowRight') f.x = Math.min(pageWidths[f.pageIndex] - f.w, f.x + step);
                    else if (e.key === 'ArrowUp') f.y = Math.max(0, f.y - step);
                    else if (e.key === 'ArrowDown') f.y = Math.min(pageHeights[f.pageIndex] - f.h, f.y + step);
                    const el = getFieldElement(f.id);
                    const canvas = getPageCanvas(f.pageIndex + 1);
                    if (el && canvas) {
                        const s = canvas.width / pageWidths[f.pageIndex];
                        el.style.left = (f.x * s) + 'px';
                        el.style.top = (f.y * s) + 'px';
                    }
                }
            });

            // ===== Signature Pad =====
            const sigPadModal = document.getElementById('sigPadModal');
            const sigPadCanvas = document.getElementById('sigPadCanvas');
            const sigPadWrapper = document.getElementById('sigPadWrapper');
            const sigPadClear = document.getElementById('sigPadClear');
            const sigPadCancel = document.getElementById('sigPadCancel');
            const sigPadSave = document.getElementById('sigPadSave');
            const drawSigBtn = document.getElementById('drawSigBtn');

            let sigPadCtx = null;
            let sigPadDrawing = false;
            let sigPadLastX = 0, sigPadLastY = 0;
            let sigPadHasContent = false;
            let sigPadDpr = 1;

            function initSigPad() {
                const wrapperRect = sigPadWrapper.getBoundingClientRect();
                const w = Math.max(300, wrapperRect.width || 500);
                const h = 200;
                sigPadDpr = window.devicePixelRatio || 1;
                sigPadCanvas.width = w * sigPadDpr;
                sigPadCanvas.height = h * sigPadDpr;
                sigPadCanvas.style.width = w + 'px';
                sigPadCanvas.style.height = h + 'px';
                sigPadCtx = sigPadCanvas.getContext('2d');
                sigPadCtx.scale(sigPadDpr, sigPadDpr);
                sigPadCtx.strokeStyle = '#1a1a1a';
                sigPadCtx.lineWidth = 2.5;
                sigPadCtx.lineCap = 'round';
                sigPadCtx.lineJoin = 'round';
                sigPadCtx.fillStyle = 'white';
                sigPadCtx.fillRect(0, 0, w, h);
                sigPadHasContent = false;
                sigPadSave.disabled = true;
            }

            function getSigPadPos(e) {
                const rect = sigPadCanvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function sigPadStart(e) {
                e.preventDefault();
                sigPadDrawing = true;
                const pos = getSigPadPos(e);
                sigPadLastX = pos.x;
                sigPadLastY = pos.y;
            }

            function sigPadDraw(e) {
                if (!sigPadDrawing) return;
                e.preventDefault();
                const pos = getSigPadPos(e);
                sigPadCtx.beginPath();
                sigPadCtx.moveTo(sigPadLastX, sigPadLastY);
                sigPadCtx.lineTo(pos.x, pos.y);
                sigPadCtx.stroke();
                sigPadLastX = pos.x;
                sigPadLastY = pos.y;
                if (!sigPadHasContent) {
                    sigPadHasContent = true;
                    sigPadSave.disabled = false;
                }
            }

            function sigPadStop() {
                sigPadDrawing = false;
            }

            sigPadCanvas.addEventListener('mousedown', sigPadStart);
            sigPadCanvas.addEventListener('mousemove', sigPadDraw);
            sigPadCanvas.addEventListener('mouseup', sigPadStop);
            sigPadCanvas.addEventListener('mouseleave', sigPadStop);
            sigPadCanvas.addEventListener('touchstart', sigPadStart, { passive: false });
            sigPadCanvas.addEventListener('touchmove', sigPadDraw, { passive: false });
            sigPadCanvas.addEventListener('touchend', sigPadStop);

            sigPadClear.addEventListener('click', () => {
                const w = sigPadCanvas.width / sigPadDpr;
                const h = sigPadCanvas.height / sigPadDpr;
                sigPadCtx.fillStyle = 'white';
                sigPadCtx.fillRect(0, 0, w, h);
                sigPadHasContent = false;
                sigPadSave.disabled = true;
            });

            sigPadCancel.addEventListener('click', () => {
                sigPadModal.classList.remove('show');
            });

            sigPadSave.addEventListener('click', () => {
                if (!sigPadHasContent) return;
                // Trim white borders for a cleaner signature
                const fullDataUrl = sigPadCanvas.toDataURL('image/png');
                const trimImg = new Image();
                trimImg.onload = function() {
                    const tmpCanvas = document.createElement('canvas');
                    const tw = trimImg.naturalWidth;
                    const th = trimImg.naturalHeight;
                    tmpCanvas.width = tw;
                    tmpCanvas.height = th;
                    const tmpCtx = tmpCanvas.getContext('2d');
                    tmpCtx.drawImage(trimImg, 0, 0);
                    const imgData = tmpCtx.getImageData(0, 0, tw, th);
                    const data = imgData.data;
                    let minX = tw, minY = th, maxX = 0, maxY = 0;
                    for (let y = 0; y < th; y++) {
                        for (let x = 0; x < tw; x++) {
                            const idx = (y * tw + x) * 4;
                            const r = data[idx], g = data[idx+1], b = data[idx+2];
                            if (r < 240 || g < 240 || b < 240) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                            }
                        }
                    }
                    if (maxX >= minX && maxY >= minY) {
                        const pad = 10;
                        minX = Math.max(0, minX - pad);
                        minY = Math.max(0, minY - pad);
                        maxX = Math.min(tw, maxX + pad);
                        maxY = Math.min(th, maxY + pad);
                        const cropW = maxX - minX;
                        const cropH = maxY - minY;
                        const cropCanvas = document.createElement('canvas');
                        cropCanvas.width = cropW;
                        cropCanvas.height = cropH;
                        const cropCtx = cropCanvas.getContext('2d');
                        cropCtx.drawImage(tmpCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
                        signatureImageData = cropCanvas.toDataURL('image/png');
                    } else {
                        signatureImageData = fullDataUrl;
                    }
                    sigStatus.textContent = '✅ חתימה צוירה';
                    showToast('✅ חתימה נשמרה');
                    fields.forEach(f => {
                        if (f.type === 'signature' && !f.value) {
                            f.value = signatureImageData;
                        }
                    });
                    renderFields();
                    sigPadModal.classList.remove('show');
                };
                trimImg.src = fullDataUrl;
            });

            drawSigBtn.addEventListener('click', () => {
                sigPadModal.classList.add('show');
                setTimeout(() => initSigPad(), 50);
            });

            // Close modal on backdrop click
            sigPadModal.addEventListener('click', (e) => {
                if (e.target === sigPadModal) {
                    sigPadModal.classList.remove('show');
                }
            });

            // ===== Download PDF =====
            downloadBtn.addEventListener('click', async function() {
                if (!pdfDataArrayBuffer) {
                    showToast('❌ אין PDF');
                    return;
                }

                try {
                    showToast('⏳ מכין PDF...');
                    const bufferCopy = pdfDataArrayBuffer.slice(0);
                    const newDoc = await PDFLib.PDFDocument.load(bufferCopy);

                    if (typeof fontkit !== 'undefined') {
                        newDoc.registerFontkit(fontkit);
                    }

                    let hebrewFont = null;
                    let latinFont = null;
                    try {
                        const hebUrl = 'https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansHebrew/NotoSansHebrew-Regular.ttf';
                        const fontBytes = await fetch(hebUrl).then(r => {
                            if (!r.ok) throw new Error('Hebrew font fetch failed');
                            return r.arrayBuffer();
                        });
                        hebrewFont = await newDoc.embedFont(fontBytes, { subset: true });
                    } catch (fontErr) {
                        console.warn('Could not load Hebrew font:', fontErr);
                    }
                    try {
                        const latUrl = 'https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Regular.ttf';
                        const fontBytes = await fetch(latUrl).then(r => {
                            if (!r.ok) throw new Error('Latin font fetch failed');
                            return r.arrayBuffer();
                        });
                        latinFont = await newDoc.embedFont(fontBytes, { subset: true });
                    } catch (fontErr) {
                        console.warn('Could not load Latin font, using Helvetica:', fontErr);
                    }

                    const fallbackFont = await newDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                    if (!hebrewFont) hebrewFont = fallbackFont;
                    if (!latinFont) latinFont = fallbackFont;

                    function measureRun(text, font, size) {
                        try {
                            return font.widthOfTextAtSize(text, size);
                        } catch (_) {
                            return text.length * size * 0.5;
                        }
                    }

                    for (const f of fields) {
                        const page = newDoc.getPage(f.pageIndex);
                        const { width, height } = page.getSize();
                        const x = f.x;
                        const y = height - f.y - f.h;

                        if (f.type === 'text') {
                            const rawText = (f.value || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                            let lines = rawText.split('\n');
                            if (lines.length > 1 && lines[lines.length - 1] === '') lines = lines.slice(0, -1);
                            if (lines.length && lines.some(l => l.trim())) {
                                const fontSize = f.fontSize || 14;
                                const lineHeight = fontSize * 1.35;
                                let r = 0.1, g = 0.1, b = 0.1;
                                if (f.color && /^#([0-9a-fA-F]{6})$/.test(f.color)) {
                                    r = parseInt(f.color.slice(1, 3), 16) / 255;
                                    g = parseInt(f.color.slice(3, 5), 16) / 255;
                                    b = parseInt(f.color.slice(5, 7), 16) / 255;
                                }
                                const textColor = PDFLib.rgb(r, g, b);
                                let align = f.align || (isPrimarilyHebrew(rawText) ? 'right' : 'left');
                                const fieldTopPdf = height - f.y;
                                let textY = fieldTopPdf - fontSize - 2;
                                const maxW = Math.max(10, f.w - 6);
                                const minBaseline = y - fontSize * 0.15;

                                for (let i = 0; i < lines.length; i++) {
                                    const line = lines[i];
                                    if (textY < minBaseline) break;

                                    const runs = splitScriptRuns(line);
                                    let totalWidth = 0;
                                    const measured = runs.map(run => {
                                        const font = run.hebrew ? hebrewFont : latinFont;
                                        const w = measureRun(run.text, font, fontSize);
                                        totalWidth += w;
                                        return { ...run, font, w };
                                    });
                                    totalWidth = Math.min(totalWidth, maxW);

                                    let cursorX = x + 3;
                                    if (align === 'right') {
                                        cursorX = x + f.w - totalWidth - 3;
                                    } else if (align === 'center') {
                                        cursorX = x + (f.w - totalWidth) / 2;
                                    }
                                    cursorX = Math.max(x + 1, cursorX);
                                    const lineStartX = cursorX;

                                    for (const run of measured) {
                                        try {
                                            page.drawText(run.text, {
                                                x: cursorX,
                                                y: textY,
                                                size: fontSize,
                                                font: run.font,
                                                color: textColor
                                            });
                                            if (f.bold) {
                                                page.drawText(run.text, {
                                                    x: cursorX + 0.35,
                                                    y: textY,
                                                    size: fontSize,
                                                    font: run.font,
                                                    color: textColor
                                                });
                                            }
                                        } catch (textErr) {
                                            try {
                                                page.drawText(run.text, {
                                                    x: cursorX,
                                                    y: textY,
                                                    size: fontSize,
                                                    font: fallbackFont,
                                                    color: textColor
                                                });
                                            } catch (e2) { }
                                        }
                                        cursorX += run.w;
                                    }

                                    if (f.underline && line.trim()) {
                                        try {
                                            page.drawLine({
                                                start: { x: lineStartX, y: textY - 1.5 },
                                                end:   { x: lineStartX + totalWidth, y: textY - 1.5 },
                                                thickness: Math.max(0.6, fontSize * 0.06),
                                                color: textColor
                                            });
                                        } catch (_) {}
                                    }

                                    textY -= lineHeight;
                                }
                            }
                        } else if (f.type === 'checkbox') {
                            const size = Math.max(8, Math.min(f.w, f.h));
                            const borderW = Math.max(0.8, Math.min(1.2, size * 0.08));
                            page.drawRectangle({
                                x: x,
                                y: y,
                                width: size,
                                height: size,
                                borderColor: PDFLib.rgb(0, 0, 0),
                                borderWidth: borderW,
                                color: PDFLib.rgb(1, 1, 1)
                            });
                            if (f.value === true) {
                                const pad = size * 0.2;
                                const thickness = Math.max(1.1, size * 0.12);
                                page.drawLine({
                                    start: { x: x + pad, y: y + size * 0.45 },
                                    end:   { x: x + size * 0.42, y: y + pad },
                                    thickness: thickness,
                                    color: PDFLib.rgb(0, 0.45, 0.1)
                                });
                                page.drawLine({
                                    start: { x: x + size * 0.40, y: y + pad },
                                    end:   { x: x + size - pad, y: y + size - pad },
                                    thickness: thickness,
                                    color: PDFLib.rgb(0, 0.45, 0.1)
                                });
                            }
                        } else if (f.type === 'signature' && f.value) {
                            try {
                                const imgBytes = await fetch(f.value).then(res => res.arrayBuffer());
                                const embeddedImage = await newDoc.embedPng(imgBytes);
                                page.drawImage(embeddedImage, {
                                    x: x,
                                    y: y,
                                    width: f.w,
                                    height: f.h
                                });
                            } catch (err) {
                                console.warn('Signature embed error:', err);
                                try {
                                    const imgBytes = await fetch(f.value).then(res => res.arrayBuffer());
                                    const embeddedImage = await newDoc.embedJpg(imgBytes);
                                    page.drawImage(embeddedImage, { x: x, y: y, width: f.w, height: f.h });
                                } catch (e2) {
                                    console.warn('Signature fallback also failed', e2);
                                }
                            }
                        }
                    }

                    const pdfBytes = await newDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'edited_document.pdf';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 8000);
                    showToast('💾 הורדה הושלמה');
                } catch (err) {
                    showToast('❌ שגיאה: ' + err.message);
                    console.error(err);
                }
            });

            // ===== File inputs =====
            pdfUpload.addEventListener('change', function() {
                if (this.files && this.files[0]) loadPdfFile(this.files[0]);
            });
            sigUpload.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    loadSignatureFile(this.files[0]);
                }
            });

            // ===== Drag & drop on upload cards =====
            document.querySelectorAll('.upload-card').forEach(card => {
                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    card.style.borderColor = 'var(--btn-primary)';
                });
                card.addEventListener('dragleave', () => {
                    card.style.borderColor = 'var(--upload-card-border)';
                });
                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    card.style.borderColor = 'var(--upload-card-border)';
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        const f = files[0];
                        const isSvg = f.type === 'image/svg+xml' || f.name.toLowerCase().endsWith('.svg');
                        if (f.type === 'application/pdf') {
                            loadPdfFile(f);
                            pdfFileName.textContent = f.name;
                        } else if (f.type.startsWith('image/') || isSvg) {
                            loadSignatureFile(f);
                        }
                    }
                });
            });

            // ===== Lazy scroll: render visible pages =====
            let scrollTimeout;
            container.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    renderVisiblePages();
                    renderFields();
                }, 150);
            });

            // ===== Window resize =====
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (pdfDoc) {
                        renderAllPages();
                    }
                }, 350);
            });

            // Init
            updatePageNav();
            updateUndoRedoButtons();
            updateZoomDisplay();
            showToast('📄 העלה PDF והתחל', 3500);
            console.log('✅ עורך PDF מתקדם (גרסה משופרת 2.0) טעון');
        })();
    </script>
</body>
</html>
