<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>עורך PDF</title>
    <link rel="icon" href="SP.png" type="image/png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #90dcfc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #ffe699;
            padding: 20px 18px 18px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            height: 95vh;
            max-height: 95vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn:active {
            transform: scale(0.96);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .btn-signature {
            background: #ffffff;
            border: 2px solid #703efa;
            color: #703efa;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-signature:hover {
            background: #703efa;
            color: #ffffff;
            border-color: #703efa;
            box-shadow: 0 4px 12px rgba(112, 62, 250, 0.3);
        }
        .btn-signature:active {
            transform: scale(0.96);
        }
        .btn-signature.active {
            box-shadow: none !important;
            outline: none !important;
        }

        .btn-text {
            background: #ffffff;
            border: 2px solid #0d6efd;
            color: #0d6efd;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-text:hover {
            background: #0d6efd;
            color: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }
        .btn-text:active {
            transform: scale(0.96);
        }
        .btn-text.active {
            box-shadow: none !important;
            outline: none !important;
        }

        .btn-checkbox {
            background: #ffffff;
            border: 2px solid #198754;
            color: #198754;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-checkbox:hover {
            background: #198754;
            color: #ffffff;
            border-color: #198754;
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);
        }
        .btn-checkbox:active {
            transform: scale(0.96);
        }
        .btn-checkbox.active {
            box-shadow: none !important;
            outline: none !important;
        }

        .btn-delete-all {
            background: #ffffff;
            border: 2px solid #dc3545;
            color: #dc3545;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-delete-all:hover {
            background: #dc3545;
            color: #ffffff;
            border-color: #dc3545;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }
        .btn-delete-all:active {
            transform: scale(0.96);
        }
        .btn-delete-all.active {
            box-shadow: none !important;
            outline: none !important;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .upload-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border: 2px dashed #d0d0d0;
            transition: all 0.2s;
        }
        .upload-card:hover {
            border-color: #0d6efd;
            background: #f0f4ff;
        }
        .upload-card label {
            background: #0d6efd;
            color: white;
            padding: 5px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .upload-card label:hover {
            background: #0b5ed7;
        }
        .upload-card input[type="file"] {
            display: none;
        }
        .upload-card .file-status {
            flex: 1;
            font-size: 12px;
            color: #222;
            background: white;
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid #ddd;
            min-width: 70px;
            word-break: break-word;
            text-align: center;
        }
        .upload-card .clear-btn {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 4px 10px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .upload-card .clear-btn:hover {
            background: #5a6268;
        }

        .upload-card.purple label {
            background: #703efa;
        }
        .upload-card.purple label:hover {
            background: #6026ff;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 4px 0 4px;
            justify-content: center;
            background: #f1f3f5;
            padding: 6px 12px;
            border-radius: 50px;
            flex-shrink: 0;
        }

        .page-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 3px 0 4px;
            padding: 4px 12px;
            background: #f1f3f5;
            border-radius: 40px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .page-nav span {
            font-weight: 700;
            font-size: 13px;
            color: #1a1a1a;
        }
        .page-nav .nav-btn {
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 2px 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
        }
        .page-nav .nav-btn:hover {
            background: #0b5ed7;
        }
        .page-nav .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-nav .page-num {
            font-weight: 700;
            font-size: 13px;
            min-width: 40px;
            text-align: center;
            background: white;
            padding: 2px 8px;
            border-radius: 30px;
            border: 1px solid #ddd;
        }

        .info-text {
            font-size: 12px;
            color: #444;
            margin: 2px 0 4px;
            text-align: center;
            background: #faf9e6;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            border: 1px solid #eee;
            flex-shrink: 0;
        }

        .pdf-container {
            border: 2px solid #ddd;
            border-radius: 18px;
            overflow: auto;
            background: #e9ecef;
            padding: 10px 6px;
            touch-action: pan-y;
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
        }

        .pdf-page-wrapper {
            position: relative;
            margin: 0 auto 12px auto;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            display: block !important;
            max-width: 100%;
        }
        .pdf-page-wrapper canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            border-radius: 8px;
        }

        .field-overlay {
            position: absolute;
            border: 2.5px solid #703efa;
            border-radius: 8px;
            background: rgba(112, 62, 250, 0.06);
            cursor: grab;
            touch-action: none;
            user-select: none;
            padding: 4px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
            z-index: 10;
            min-width: 16px;
            min-height: 16px;
            display: block !important;
        }
        .field-overlay.text-field {
            border-color: #0d6efd;
            background: rgba(13, 110, 253, 0.06);
        }
        .field-overlay textarea {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            padding: 2px;
            cursor: text;
            color: #1a1a1a;
        }
        .field-overlay .field-label {
            position: absolute;
            top: -24px;
            right: 0;
            background: #703efa;
            color: white;
            padding: 1px 8px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .field-overlay.text-field .field-label {
            background: #0d6efd;
        }
        .field-overlay .delete-handle {
            position: absolute;
            top: -24px;
            left: 0;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 1px 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            touch-action: manipulation;
        }
        .field-overlay .delete-handle:hover {
            background: #c82333;
        }
        .field-overlay .resize-handle {
            position: absolute;
            bottom: -8px;
            right: -8px;
            width: 16px;
            height: 16px;
            background: #703efa;
            border-radius: 50%;
            cursor: nwse-resize;
            border: 2.5px solid white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.25);
            touch-action: none;
        }
        .field-overlay.text-field .resize-handle {
            background: #0d6efd;
        }
        .field-overlay .checkbox-mark {
            font-size: 18px;
            line-height: 1;
            user-select: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .field-overlay .signature-placeholder {
            font-size: 12px;
            color: #94a3b8;
            font-style: italic;
        }
        .field-overlay img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            border-radius: 4px;
        }

        .app-footer {
            margin-top: 6px;
            padding: 4px 0 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .footer-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 0.3px;
            text-align: center;
        }
        .footer-logo {
            height: 1.4em;
            width: auto;
            display: inline-block;
            vertical-align: middle;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a1a;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .upload-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .header h1 {
                justify-content: center;
                font-size: 20px;
            }
            .header-actions {
                justify-content: center;
            }
            .container {
                padding: 12px 8px;
                height: 95vh;
                max-height: 95vh;
            }
            .toolbar {
                border-radius: 24px;
                padding: 6px 10px;
            }
            .toolbar .btn {
                padding: 4px 10px;
                font-size: 11px;
                flex: 1;
                min-width: 60px;
            }
            .pdf-container {
                padding: 8px 4px;
            }
            .info-text {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
        @media (max-width: 480px) {
            .btn {
                font-size: 11px;
                padding: 4px 10px;
            }
            .upload-card {
                padding: 6px 8px;
                flex-direction: column;
                align-items: stretch;
            }
            .upload-card .file-status {
                text-align: center;
            }
            .header h1 {
                font-size: 18px;
            }
            .toolbar .btn {
                font-size: 10px;
                padding: 4px 8px;
                min-width: 50px;
            }
            .field-overlay .checkbox-mark {
                font-size: 14px;
            }
            .footer-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>✒️ עורך PDF מתקדם</h1>
            <div class="header-actions">
                <button class="btn btn-success" id="downloadBtn">💾 הורד PDF</button>
            </div>
        </div>

        <div class="upload-grid">
            <div class="upload-card">
                <label for="pdfUpload">📤 טען PDF</label>
                <input type="file" id="pdfUpload" accept=".pdf">
                <span class="file-status" id="pdfFileName">לא נבחר קובץ</span>
                <button class="clear-btn" id="clearPdfBtn">🧹 נקה</button>
            </div>
            <div class="upload-card purple">
                <label for="sigUpload">🖊️ העלה חתימה</label>
                <input type="file" id="sigUpload" accept="image/*">
                <span class="file-status" id="sigStatus">לא נטענה</span>
                <button class="clear-btn" id="clearSigBtn">✖️ הסר</button>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn-signature" data-tool="signature">✍️ חתימה</button>
            <button class="btn-text" data-tool="text">📃 טקסט</button>
            <button class="btn-checkbox" data-tool="checkbox">❎ סימון</button>
            <button class="btn-delete-all" id="deleteAllBtn">🗑️ מחק הכל</button>
        </div>

        <div class="page-nav">
            <button class="nav-btn" id="prevPage">‹</button>
            <span>📄 עמוד</span>
            <span class="page-num" id="pageNumDisplay">1 / 1</span>
            <button class="nav-btn" id="nextPage">›</button>
        </div>

        <div class="info-text">💡 בחר כלי ← לחץ על הדף להוספה | גרור להזזה | גרור פינה לשינוי גודל</div>

        <div class="pdf-container" id="pdfContainer">
            <div id="pagesContainer"></div>
        </div>

        <div class="app-footer">
            <div class="footer-text">
                <span> © 2026 כל הזכויות שמורות</span>
                <img src="OG_Blue_Logo2.png" alt="לוגו" class="footer-logo">
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            let pdfDoc = null;
            let pdfDataArrayBuffer = null;
            let currentPage = 1;
            let totalPages = 0;
            let scale = 1.5;

            let fields = [];
            let fieldIdCounter = 0;
            let selectedTool = 'signature';
            let signatureImageData = null;

            let isDragging = false;
            let dragTarget = null;
            let dragOffsetX = 0,
                dragOffsetY = 0;
            let isResizing = false;
            let resizeTarget = null;
            let resizeStartX = 0,
                resizeStartY = 0;
            let resizeStartW = 0,
                resizeStartH = 0;

            let pageWidths = [];
            let pageHeights = [];

            const container = document.getElementById('pdfContainer');
            const pagesContainer = document.getElementById('pagesContainer');
            const pdfUpload = document.getElementById('pdfUpload');
            const sigUpload = document.getElementById('sigUpload');
            const pdfFileName = document.getElementById('pdfFileName');
            const sigStatus = document.getElementById('sigStatus');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearPdfBtn = document.getElementById('clearPdfBtn');
            const clearSigBtn = document.getElementById('clearSigBtn');
            const deleteAllBtn = document.getElementById('deleteAllBtn');
            const pageNumDisplay = document.getElementById('pageNumDisplay');
            const prevPage = document.getElementById('prevPage');
            const nextPage = document.getElementById('nextPage');
            const toastEl = document.getElementById('toast');

            function showToast(msg, duration = 3000) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastEl._timeout);
                toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), duration);
            }

            function getPageWrapper(pageNum) {
                return document.querySelector(`.pdf-page-wrapper[data-page="${pageNum}"]`);
            }

            function getPageCanvas(pageNum) {
                const wrapper = getPageWrapper(pageNum);
                if (!wrapper) return null;
                return wrapper.querySelector('canvas');
            }

            function loadPdfFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pdfDataArrayBuffer = e.target.result;
                    const bufferForPdfjs = pdfDataArrayBuffer.slice(0);
                    pdfFileName.textContent = file.name;

                    pdfjsLib.getDocument({ data: bufferForPdfjs }).promise.then(doc => {
                        pdfDoc = doc;
                        totalPages = doc.numPages;
                        currentPage = 1;
                        fields = [];
                        fieldIdCounter = 0;
                        pageWidths = [];
                        pageHeights = [];
                        renderAllPages();
                        showToast('✅ PDF נטען בהצלחה');
                    }).catch(err => {
                        showToast('❌ שגיאה: ' + err.message);
                        console.error(err);
                    });
                };
                reader.readAsArrayBuffer(file);
            }

            function loadSignatureFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    signatureImageData = e.target.result;
                    sigStatus.textContent = '✅ חתימה נטענה';
                    showToast('✅ חתימה נטענה');
                    if (pdfDoc) renderAllPages();
                };
                reader.readAsDataURL(file);
            }

            async function renderAllPages() {
                if (!pdfDoc) return;
                pagesContainer.innerHTML = '';
                pageWidths = [];
                pageHeights = [];

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1 });
                    const width = viewport.width;
                    const height = viewport.height;
                    pageWidths.push(width);
                    pageHeights.push(height);

                    const containerWidth = container.clientWidth - 24;
                    let idealScale = containerWidth / width;
                    idealScale = Math.min(2.0, Math.max(0.5, idealScale));
                    scale = idealScale;

                    const scaledViewport = page.getViewport({ scale: scale });
                    const wrapper = document.createElement('div');
                    wrapper.className = 'pdf-page-wrapper';
                    wrapper.dataset.page = i;
                    wrapper.style.position = 'relative';
                    wrapper.style.width = scaledViewport.width + 'px';
                    wrapper.style.margin = '0 auto 12px auto';
                    wrapper.style.maxWidth = '100%';

                    const canvas = document.createElement('canvas');
                    canvas.width = scaledViewport.width;
                    canvas.height = scaledViewport.height;
                    canvas.style.display = 'block';
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';

                    wrapper.appendChild(canvas);
                    pagesContainer.appendChild(wrapper);

                    const renderContext = {
                        canvasContext: canvas.getContext('2d'),
                        viewport: scaledViewport
                    };
                    await page.render(renderContext).promise;
                }

                renderFields();
                updatePageNav();
                showToast('✅ הדפים נטענו');
            }

            function addField(pageNum, x, y) {
                if (selectedTool === 'cursor') {
                    showToast('ℹ️ בחר כלי תחילה');
                    return;
                }

                const pageIndex = pageNum - 1;
                const field = {
                    id: fieldIdCounter++,
                    type: selectedTool,
                    pageIndex: pageIndex,
                    x: x,
                    y: y,
                    w: 140,
                    h: 30,
                    value: '',
                    fontSize: 14
                };

                if (selectedTool === 'signature') {
                    field.w = 160;
                    field.h = 60;
                    field.value = signatureImageData || '';
                } else if (selectedTool === 'checkbox') {
                    field.w = 16;
                    field.h = 16;
                    field.value = false;
                } else if (selectedTool === 'text') {
                    field.w = 180;
                    field.h = 35;
                    field.value = '';
                }

                fields.push(field);
                renderFields();
                showToast('✅ שדה נוסף: ' + selectedTool);
            }

            function renderFields() {
                document.querySelectorAll('.field-overlay').forEach(el => el.remove());

                for (const f of fields) {
                    const pageNum = f.pageIndex + 1;
                    const wrapper = getPageWrapper(pageNum);
                    if (!wrapper) continue;
                    const canvas = wrapper.querySelector('canvas');
                    if (!canvas) continue;

                    const scale = canvas.width / pageWidths[f.pageIndex];
                    const relX = f.x * scale;
                    const relY = f.y * scale;
                    const relW = f.w * scale;
                    const relH = f.h * scale;

                    const el = document.createElement('div');
                    el.className = 'field-overlay';
                    if (f.type === 'text') el.classList.add('text-field');
                    el.dataset.fieldId = f.id;
                    el.style.left = relX + 'px';
                    el.style.top = relY + 'px';
                    el.style.width = relW + 'px';
                    el.style.height = relH + 'px';

                    const label = document.createElement('div');
                    label.className = 'field-label';
                    const labels = { text: 'טקסט', signature: 'חתימה', checkbox: 'סימון' };
                    label.textContent = labels[f.type] || f.type;
                    el.appendChild(label);

                    if (f.type === 'text') {
                        const ta = document.createElement('textarea');
                        ta.value = f.value || '';
                        ta.placeholder = 'הקלד טקסט...';
                        ta.addEventListener('input', (e) => { f.value = e.target.value; });
                        ta.addEventListener('mousedown', (e) => e.stopPropagation());
                        ta.addEventListener('click', (e) => e.stopPropagation());
                        el.appendChild(ta);
                    } else if (f.type === 'checkbox') {
                        const span = document.createElement('span');
                        span.className = 'checkbox-mark';
                        const size = Math.min(f.w, f.h);
                        const fontSize = Math.max(8, Math.min(18, size * 0.8));
                        span.style.fontSize = fontSize + 'px';
                        span.textContent = f.value ? '☑' : '☐';
                        span.addEventListener('click', (e) => {
                            e.stopPropagation();
                            f.value = !f.value;
                            span.textContent = f.value ? '☑' : '☐';
                        });
                        el.appendChild(span);
                    } else if (f.type === 'signature') {
                        if (f.value) {
                            const img = document.createElement('img');
                            img.src = f.value;
                            el.appendChild(img);
                        } else {
                            const span = document.createElement('span');
                            span.className = 'signature-placeholder';
                            span.textContent = '✍️ חתימה';
                            el.appendChild(span);
                        }
                    }

                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-handle';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        fields = fields.filter(field => field.id !== f.id);
                        renderFields();
                        showToast('🗑️ שדה נמחק');
                    });
                    el.appendChild(delBtn);

                    const resizeHandle = document.createElement('div');
                    resizeHandle.className = 'resize-handle';
                    resizeHandle.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        startResize(e, f);
                    });
                    resizeHandle.addEventListener('touchstart', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        startResizeTouch(e, f);
                    }, { passive: false });
                    el.appendChild(resizeHandle);

                    el.addEventListener('mousedown', (e) => {
                        if (e.target === delBtn || e.target === resizeHandle) return;
                        if (f.type === 'text' && e.target.tagName === 'TEXTAREA') return;
                        startDrag(e, f);
                    });
                    el.addEventListener('touchstart', (e) => {
                        if (e.target === delBtn || e.target === resizeHandle) return;
                        if (f.type === 'text' && e.target.tagName === 'TEXTAREA') return;
                        startDragTouch(e, f);
                    }, { passive: false });

                    wrapper.appendChild(el);
                }

                document.removeEventListener('mousemove', onDragMove);
                document.removeEventListener('mouseup', onDragEnd);
                document.removeEventListener('mousemove', onResizeMove);
                document.removeEventListener('mouseup', onResizeEnd);
                document.addEventListener('mousemove', onDragMove);
                document.addEventListener('mouseup', onDragEnd);
                document.addEventListener('mousemove', onResizeMove);
                document.addEventListener('mouseup', onResizeEnd);
            }

            function startDrag(e, field) {
                isDragging = true;
                dragTarget = field;
                const el = e.target.closest('.field-overlay');
                const rect = el.getBoundingClientRect();
                dragOffsetX = e.clientX - rect.left;
                dragOffsetY = e.clientY - rect.top;
                el.style.cursor = 'grabbing';
                e.preventDefault();
            }

            function onDragMove(e) {
                if (!isDragging || !dragTarget) return;
                const pageNum = dragTarget.pageIndex + 1;
                const canvas = getPageCanvas(pageNum);
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const scale = canvas.width / pageWidths[dragTarget.pageIndex];

                let newX = (e.clientX - rect.left - dragOffsetX) / scale;
                let newY = (e.clientY - rect.top - dragOffsetY) / scale;
                newX = Math.max(0, Math.min(newX, pageWidths[dragTarget.pageIndex] - dragTarget.w));
                newY = Math.max(0, Math.min(newY, pageHeights[dragTarget.pageIndex] - dragTarget.h));
                dragTarget.x = newX;
                dragTarget.y = newY;
                renderFields();
            }

            function onDragEnd(e) {
                if (isDragging) {
                    isDragging = false;
                    dragTarget = null;
                    document.querySelectorAll('.field-overlay').forEach(el => el.style.cursor = 'grab');
                }
            }

            let touchDragData = null;

            function startDragTouch(e, field) {
                const touch = e.touches[0];
                touchDragData = { field, offsetX: 0, offsetY: 0 };
                const el = e.target.closest('.field-overlay');
                const rect = el.getBoundingClientRect();
                touchDragData.offsetX = touch.clientX - rect.left;
                touchDragData.offsetY = touch.clientY - rect.top;
                e.preventDefault();
            }

            document.addEventListener('touchmove', (e) => {
                if (!touchDragData) return;
                const touch = e.touches[0];
                const field = touchDragData.field;
                const pageNum = field.pageIndex + 1;
                const canvas = getPageCanvas(pageNum);
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const scale = canvas.width / pageWidths[field.pageIndex];

                let newX = (touch.clientX - rect.left - touchDragData.offsetX) / scale;
                let newY = (touch.clientY - rect.top - touchDragData.offsetY) / scale;
                newX = Math.max(0, Math.min(newX, pageWidths[field.pageIndex] - field.w));
                newY = Math.max(0, Math.min(newY, pageHeights[field.pageIndex] - field.h));
                field.x = newX;
                field.y = newY;
                renderFields();
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchend', () => {
                touchDragData = null;
            });

            function startResize(e, field) {
                isResizing = true;
                resizeTarget = field;
                resizeStartX = e.clientX;
                resizeStartY = e.clientY;
                resizeStartW = field.w;
                resizeStartH = field.h;
                e.preventDefault();
            }

            function onResizeMove(e) {
                if (!isResizing || !resizeTarget) return;
                const dx = (e.clientX - resizeStartX) / (window.innerWidth / 800);
                const dy = (e.clientY - resizeStartY) / (window.innerHeight / 600);
                const minSize = resizeTarget.type === 'checkbox' ? 8 : 24;
                const newW = Math.max(minSize, resizeStartW + dx);
                const newH = Math.max(minSize, resizeStartH + dy);
                resizeTarget.w = newW;
                resizeTarget.h = newH;
                renderFields();
            }

            function onResizeEnd(e) {
                isResizing = false;
                resizeTarget = null;
            }

            let touchResizeData = null;

            function startResizeTouch(e, field) {
                const touch = e.touches[0];
                touchResizeData = { field, startX: touch.clientX, startY: touch.clientY, startW: field.w,
                startH: field.h };
                e.preventDefault();
            }

            document.addEventListener('touchmove', (e) => {
                if (!touchResizeData) return;
                const touch = e.touches[0];
                const { field, startX, startY, startW, startH } = touchResizeData;
                const dx = (touch.clientX - startX) / (window.innerWidth / 800);
                const dy = (touch.clientY - startY) / (window.innerHeight / 600);
                const minSize = field.type === 'checkbox' ? 8 : 24;
                const newW = Math.max(minSize, startW + dx);
                const newH = Math.max(minSize, startH + dy);
                field.w = newW;
                field.h = newH;
                renderFields();
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchend', () => {
                touchResizeData = null;
            });

            pagesContainer.addEventListener('click', function(e) {
                if (e.target.closest('.field-overlay')) return;
                if (e.target.closest('textarea')) return;
                if (selectedTool === 'cursor') return;

                const wrapper = e.target.closest('.pdf-page-wrapper');
                if (!wrapper) return;
                const canvas = wrapper.querySelector('canvas');
                if (!canvas) return;
                const pageNum = parseInt(wrapper.dataset.page);
                const rect = canvas.getBoundingClientRect();
                const scale = canvas.width / pageWidths[pageNum - 1];

                const x = (e.clientX - rect.left) / scale;
                const y = (e.clientY - rect.top) / scale;
                addField(pageNum, x, y);
            });

            document.querySelectorAll('[data-tool]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedTool = this.dataset.tool;
                    showToast('🔧 כלי: ' + this.textContent.trim());
                });
            });

            function updatePageNav() {
                pageNumDisplay.textContent = `${currentPage} / ${totalPages || 1}`;
                prevPage.disabled = currentPage <= 1;
                nextPage.disabled = currentPage >= totalPages;
            }

            function goToPage(pageNum) {
                if (pageNum < 1 || pageNum > totalPages) return;
                currentPage = pageNum;
                updatePageNav();
                const wrapper = getPageWrapper(pageNum);
                if (wrapper) {
                    wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            prevPage.addEventListener('click', () => goToPage(currentPage - 1));
            nextPage.addEventListener('click', () => goToPage(currentPage + 1));

            deleteAllBtn.addEventListener('click', () => {
                if (fields.length === 0) return;
                if (confirm('למחוק את כל השדות?')) {
                    fields = [];
                    renderFields();
                    showToast('🗑️ כל השדות נמחקו');
                }
            });

            clearPdfBtn.addEventListener('click', () => {
                pdfDoc = null;
                pdfDataArrayBuffer = null;
                pdfFileName.textContent = 'לא נבחר קובץ';
                pagesContainer.innerHTML = '';
                totalPages = 0;
                currentPage = 1;
                fields = [];
                fieldIdCounter = 0;
                pageWidths = [];
                pageHeights = [];
                updatePageNav();
                pdfUpload.value = '';
                showToast('🧹 PDF נוקה');
            });

            clearSigBtn.addEventListener('click', () => {
                signatureImageData = null;
                sigStatus.textContent = 'לא נטענה';
                sigUpload.value = '';
                showToast('✖️ חתימה הוסרה');
            });

            downloadBtn.addEventListener('click', async function() {
                if (!pdfDataArrayBuffer) {
                    showToast('❌ אין PDF');
                    return;
                }
                if (fields.length === 0) {
                    showToast('❌ אין שדות להורדה');
                    return;
                }

                try {
                    const bufferCopy = pdfDataArrayBuffer.slice(0);
                    const newDoc = await PDFLib.PDFDocument.load(bufferCopy);
                    const font = await newDoc.embedFont(PDFLib.StandardFonts.Helvetica);

                    for (const f of fields) {
                        const page = newDoc.getPage(f.pageIndex);
                        const { width, height } = page.getSize();
                        const x = f.x;
                        const y = height - f.y - f.h;

                        if (f.type === 'text') {
                            const cleanText = f.value || '';
                            if (cleanText) {
                                page.drawText(cleanText, {
                                    x: x,
                                    y: y,
                                    size: f.fontSize,
                                    font: font,
                                    color: PDFLib.rgb(0.1, 0.1, 0.1)
                                });
                            }
                        } else if (f.type === 'checkbox') {
                            page.drawRectangle({
                                x: x,
                                y: y,
                                width: f.h,
                                height: f.h,
                                borderColor: PDFLib.rgb(0, 0, 0),
                                borderWidth: 1,
                                color: PDFLib.rgb(1, 1, 1)
                            });
                            if (f.value === true) {
                                const pad = f.h * 0.25;
                                const startX = x + pad,
                                    startY = y + pad;
                                const endX = x + f.h - pad,
                                    endY = y + f.h - pad;
                                const thickness = Math.max(1, f.h * 0.12);
                                page.drawLine({ start: { x: startX, y: startY }, end: { x: endX, y: endY },
                                    thickness: thickness, color: PDFLib.rgb(0, 0, 0) });
                                page.drawLine({ start: { x: endX, y: startY }, end: { x: startX, y: endY },
                                    thickness: thickness, color: PDFLib.rgb(0, 0, 0) });
                            }
                        } else if (f.type === 'signature' && f.value) {
                            try {
                                const pngBytes = await fetch(f.value).then(res => res.arrayBuffer());
                                const pngImage = await newDoc.embedPng(pngBytes);
                                page.drawImage(pngImage, { x: x, y: y, width: f.w, height: f.h });
                            } catch (err) { console.warn('Signature error:', err); }
                        }
                    }

                    const pdfBytes = await newDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'edited_document.pdf';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    showToast('💾 הורדה הושלמה');
                } catch (err) {
                    showToast('❌ שגיאה: ' + err.message);
                    console.error(err);
                }
            });

            pdfUpload.addEventListener('change', function(e) {
                if (this.files && this.files[0]) loadPdfFile(this.files[0]);
            });
            sigUpload.addEventListener('change', function(e) {
                if (this.files && this.files[0]) loadSignatureFile(this.files[0]);
            });

            document.querySelectorAll('.upload-card').forEach(card => {
                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    card.style.borderColor = '#0d6efd';
                });
                card.addEventListener('dragleave', () => {
                    card.style.borderColor = '#d0d0d0';
                });
                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    card.style.borderColor = '#d0d0d0';
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        if (files[0].type === 'application/pdf') {
                            loadPdfFile(files[0]);
                            pdfUpload.files = files;
                            pdfFileName.textContent = files[0].name;
                        } else if (files[0].type.startsWith('image/')) {
                            loadSignatureFile(files[0]);
                            sigUpload.files = files;
                            sigStatus.textContent = '✅ חתימה נטענה';
                        }
                    }
                });
            });

            updatePageNav();
            showToast('📄 העלה PDF והתחל', 4000);
            console.log('✅ עורך PDF מתקדם טעון');
        })();
    </script>
</body>
</html>
