<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>עורך PDF מתקדם</title>
    <link rel="icon" href="SP.png" type="image/png">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- pdf-lib + fontkit for Hebrew support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #90dcfc;
            --container-bg: #ffe699;
            --text-color: #1a1a1a;
            --toolbar-bg: #f1f3f5;
            --info-bg: #faf9e6;
            --info-border: #eee;
            --pdf-container-bg: #e9ecef;
            --border-color: #ddd;
            --upload-card-bg: #f8f9fa;
            --upload-card-border: #d0d0d0;
            --upload-card-hover: #f0f4ff;
            --upload-card-hover-border: #0d6efd;
            --btn-primary: #0d6efd;
            --btn-primary-hover: #0b5ed7;
            --btn-success: #28a745;
            --btn-success-hover: #218838;
            --btn-danger: #dc3545;
            --btn-danger-hover: #c82333;
            --btn-signature: #703efa;
            --btn-checkbox: #198754;
            --field-label-sig: #703efa;
            --field-label-text: #0d6efd;
            --field-label-check: #198754;
            --shadow-color: rgba(0, 0, 0, 0.12);
            --page-shadow: rgba(0, 0, 0, 0.08);
            --text-secondary: #444;
            --text-muted: #6c757d;
            --text-light: #94a3b8;
            --bg-white: #ffffff;
            --bg-hover-light: #e9ecef;
            --border-light: #ccd;
            --border-lighter: #dde3ea;
            --footer-color: #2c3e50;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --container-bg: #16213e;
            --text-color: #e0e0e0;
            --toolbar-bg: #0f3460;
            --info-bg: #1a1a3e;
            --info-border: #333;
            --pdf-container-bg: #0a0a1a;
            --border-color: #333;
            --upload-card-bg: #1e2a4a;
            --upload-card-border: #444;
            --upload-card-hover: #1e3a6a;
            --upload-card-hover-border: #4a90d9;
            --btn-primary: #4a90d9;
            --btn-primary-hover: #3a80c9;
            --btn-success: #2ecc71;
            --btn-success-hover: #27ae60;
            --btn-danger: #e74c3c;
            --btn-danger-hover: #c0392b;
            --btn-signature: #9d6eff;
            --btn-checkbox: #2ecc71;
            --field-label-sig: #9d6eff;
            --field-label-text: #4a90d9;
            --field-label-check: #2ecc71;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --page-shadow: rgba(0, 0, 0, 0.3);
            --text-secondary: #b0b0b0;
            --text-muted: #888;
            --text-light: #666;
            --bg-white: #1e2a4a;
            --bg-hover-light: #2a3a5a;
            --border-light: #445;
            --border-lighter: #345;
            --footer-color: #a0a0c0;
        }

        [data-theme="modern"] {
            --bg-color: #f0f4f8;
            --container-bg: #ffffff;
            --text-color: #1a1a2e;
            --toolbar-bg: #f7f8fa;
            --info-bg: #e8f4f8;
            --info-border: #d0e0e8;
            --pdf-container-bg: #e8eaed;
            --border-color: #dde2e8;
            --upload-card-bg: #f7f8fa;
            --upload-card-border: #c5cdd6;
            --upload-card-hover: #e8f0ff;
            --upload-card-hover-border: #2563eb;
            --btn-primary: #2563eb;
            --btn-primary-hover: #1d4ed8;
            --btn-success: #059669;
            --btn-success-hover: #047857;
            --btn-danger: #dc2626;
            --btn-danger-hover: #b91c1c;
            --btn-signature: #7c3aed;
            --btn-checkbox: #059669;
            --field-label-sig: #7c3aed;
            --field-label-text: #2563eb;
            --field-label-check: #059669;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --page-shadow: rgba(0, 0, 0, 0.06);
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-light: #94a3b8;
            --bg-white: #ffffff;
            --bg-hover-light: #f1f5f9;
            --border-light: #cbd5e1;
            --border-lighter: #e2e8f0;
            --footer-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--container-bg);
            padding: 20px 18px 18px;
            border-radius: 24px;
            box-shadow: 0 12px 40px var(--shadow-color);
            display: flex;
            flex-direction: column;
            height: 95vh;
            max-height: 95vh;
            transition: background 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .theme-select {
            background: var(--bg-white);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 40px;
            padding: 6px 14px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }
        .theme-select:hover {
            border-color: var(--btn-primary);
        }
        .theme-select:focus {
            border-color: var(--btn-primary);
        }

        .btn {
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn:active {
            transform: scale(0.96);
        }

        .btn-success {
            background: var(--btn-success);
            color: white;
        }
        .btn-success:hover {
            background: var(--btn-success-hover);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .btn-undo, .btn-redo {
            background: var(--bg-white);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-undo:hover:not(:disabled), .btn-redo:hover:not(:disabled) {
            border-color: var(--btn-primary);
            color: var(--btn-primary);
        }
        .btn-undo:disabled, .btn-redo:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-undo:active, .btn-redo:active {
            transform: scale(0.96);
        }

        .btn-signature {
            background: var(--bg-white);
            border: 2px solid var(--btn-signature);
            color: var(--btn-signature);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-signature:hover, .btn-signature.active {
            background: var(--btn-signature);
            color: var(--bg-white);
            border-color: var(--btn-signature);
            box-shadow: 0 4px 12px rgba(112, 62, 250, 0.3);
        }
        .btn-signature:active {
            transform: scale(0.96);
        }

        .btn-text {
            background: var(--bg-white);
            border: 2px solid var(--btn-primary);
            color: var(--btn-primary);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-text:hover, .btn-text.active {
            background: var(--btn-primary);
            color: var(--bg-white);
            border-color: var(--btn-primary);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }
        .btn-text:active {
            transform: scale(0.96);
        }

        .btn-checkbox {
            background: var(--bg-white);
            border: 2px solid var(--btn-checkbox);
            color: var(--btn-checkbox);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-checkbox:hover, .btn-checkbox.active {
            background: var(--btn-checkbox);
            color: var(--bg-white);
            border-color: var(--btn-checkbox);
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);
        }
        .btn-checkbox:active {
            transform: scale(0.96);
        }

        .btn-delete-all {
            background: var(--bg-white);
            border: 2px solid var(--btn-danger);
            color: var(--btn-danger);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-delete-all:hover {
            background: var(--btn-danger);
            color: var(--bg-white);
            border-color: var(--btn-danger);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }
        .btn-delete-all:active {
            transform: scale(0.96);
        }

        .btn-draw-sig {
            background: var(--bg-white);
            border: 2px solid var(--btn-signature);
            color: var(--btn-signature);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .btn-draw-sig:hover {
            background: var(--btn-signature);
            color: var(--bg-white);
            border-color: var(--btn-signature);
        }
        .btn-draw-sig:active {
            transform: scale(0.96);
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .upload-card {
            background: var(--upload-card-bg);
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border: 2px dashed var(--upload-card-border);
            transition: all 0.2s;
        }
        .upload-card:hover {
            border-color: var(--upload-card-hover-border);
            background: var(--upload-card-hover);
        }
        .upload-card label {
            background: var(--btn-primary);
            color: white;
            padding: 5px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .upload-card label:hover {
            background: var(--btn-primary-hover);
        }
        .upload-card input[type="file"] {
            display: none;
        }
        .upload-card .file-status {
            flex: 1;
            font-size: 12px;
            color: var(--text-color);
            background: var(--bg-white);
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            min-width: 70px;
            word-break: break-word;
            text-align: center;
        }
        .upload-card .clear-btn {
            background: var(--text-muted);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 4px 10px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .upload-card .clear-btn:hover {
            opacity: 0.85;
        }

        .upload-card.purple label {
            background: var(--btn-signature);
        }
        .upload-card.purple label:hover {
            opacity: 0.9;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 4px 0 4px;
            justify-content: center;
            background: var(--toolbar-bg);
            padding: 6px 12px;
            border-radius: 50px;
            flex-shrink: 0;
        }

        .page-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 3px 0 4px;
            padding: 4px 12px;
            background: var(--toolbar-bg);
            border-radius: 40px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .page-nav span {
            font-weight: 700;
            font-size: 13px;
            color: var(--text-color);
        }
        .page-nav .nav-btn {
            background: var(--btn-primary);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 2px 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
            min-width: 40px;
            min-height: 32px;
        }
        .page-nav .nav-btn:hover {
            background: var(--btn-primary-hover);
        }
        .page-nav .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-nav .page-num {
            font-weight: 700;
            font-size: 13px;
            min-width: 40px;
            text-align: center;
            background: var(--bg-white);
            padding: 2px 8px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .zoom-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 3px 0 4px;
            padding: 4px 12px;
            background: var(--toolbar-bg);
            border-radius: 40px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .zoom-controls .zoom-btn {
            background: var(--btn-primary);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 3px 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            min-width: 36px;
            min-height: 30px;
        }
        .zoom-controls .zoom-btn:hover {
            background: var(--btn-primary-hover);
        }
        .zoom-controls .zoom-level {
            font-weight: 700;
            font-size: 13px;
            min-width: 50px;
            text-align: center;
            background: var(--bg-white);
            padding: 3px 10px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .info-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 2px 0 4px;
            text-align: center;
            background: var(--info-bg);
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            border: 1px solid var(--info-border);
            flex-shrink: 0;
        }

        .pdf-container {
            border: 2px solid var(--border-color);
            border-radius: 18px;
            overflow: auto;
            background: var(--pdf-container-bg);
            padding: 10px 6px;
            touch-action: pan-y;
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .pdf-page-wrapper {
            position: relative;
            margin: 0 auto 12px auto;
            background: white;
            box-shadow: 0 4px 16px var(--page-shadow);
            border-radius: 10px;
            display: block !important;
            max-width: 100%;
            direction: ltr;
        }
        .pdf-page-wrapper canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            border-radius: 8px;
            direction: ltr !important;
        }
        .pdf-page-wrapper.loading::after {
            content: '⏳ טוען...';
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            inset: 0;
            background: #f8f8f8;
            color: #888;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
        }

        .field-overlay {
            position: absolute;
            border: 2.5px solid var(--btn-signature);
            border-radius: 8px;
            background: rgba(112, 62, 250, 0.06);
            cursor: grab;
            touch-action: none;
            user-select: none;
            padding: 2px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
            z-index: 10;
            min-width: 12px;
            min-height: 12px;
            display: block !important;
            direction: ltr;
        }
        .field-overlay.text-field {
            direction: rtl;
            border-color: var(--btn-primary);
            background: rgba(13, 110, 253, 0.06);
            display: flex !important;
            flex-direction: column;
            padding: 2px;
        }
        .field-overlay.checkbox-field {
            border-color: var(--btn-checkbox);
            background: rgba(25, 135, 84, 0.06);
            padding: 1px;
            border-width: 1.5px;
            border-radius: 3px;
        }
        .field-overlay:not(.selected) {
            cursor: pointer;
        }
        .field-overlay:not(.selected) .delete-handle,
        .field-overlay:not(.selected) .resize-handle,
        .field-overlay:not(.selected) .text-toolbar {
            display: none !important;
        }
        .field-overlay.selected {
            z-index: 20;
            box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.35), 0 4px 14px rgba(0, 0, 0, 0.12);
        }
        .field-overlay textarea {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 16px;
            resize: none;
            outline: none;
            padding: 2px 4px;
            cursor: text;
            color: var(--text-color);
            direction: rtl;
            line-height: 1.35;
            box-sizing: border-box;
        }
        .text-toolbar {
            display: none;
            position: absolute;
            top: -32px;
            left: 0;
            right: auto;
            align-items: center;
            gap: 3px;
            padding: 2px 4px;
            background: rgba(255,255,255,0.96);
            border: 1px solid var(--border-lighter);
            border-radius: 8px;
            direction: ltr;
            flex-shrink: 0;
            min-height: 26px;
            z-index: 15;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            white-space: nowrap;
        }
        .field-overlay.selected .text-toolbar {
            display: flex;
        }
        .text-toolbar .tt-btn {
            border: 1px solid var(--border-light);
            background: var(--bg-hover-light);
            border-radius: 5px;
            width: 26px;
            height: 22px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: #333;
            line-height: 1;
        }
        .text-toolbar .tt-btn:hover {
            background: var(--bg-hover-light);
        }
        .text-toolbar .tt-btn.active {
            background: var(--btn-primary);
            color: #fff;
            border-color: var(--btn-primary);
        }
        .text-toolbar .tt-size {
            font-size: 11px;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
            color: var(--text-secondary);
        }
        .text-toolbar .tt-color {
            width: 22px;
            height: 20px;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            padding: 0;
            cursor: pointer;
            background: none;
        }
        .field-overlay .field-label {
            position: absolute;
            top: -26px;
            right: 0;
            background: var(--field-label-sig);
            color: white;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            min-height: 24px;
            display: flex;
            align-items: center;
        }
        .field-overlay.text-field .field-label {
            background: var(--field-label-text);
        }
        .field-overlay.checkbox-field .field-label {
            background: var(--field-label-check);
        }
        .field-overlay .delete-handle {
            position: absolute;
            top: -26px;
            left: 0;
            background: var(--btn-danger);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            touch-action: manipulation;
            min-height: 24px;
            min-width: 28px;
        }
        .field-overlay .delete-handle:hover {
