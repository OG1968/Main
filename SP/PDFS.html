<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>החתמת מסמך PDF</title>
    <!-- FAVICON - סמל עט על רקע כחול -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230d6efd'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='white'%3E✒%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #90dcfc;
            display: flex;
            justify-content: center;
            padding: 12px;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #ffe699;
            padding: 16px 14px 24px;
            border-radius: 20px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.10);
        }
        h1 {
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a1a1a;
            text-align: center;
            letter-spacing: -0.3px;
        }
        /* אזורי העלאה - מרכוז */
        .upload-area, .signature-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 12px;
        }
        .upload-area label {
            background: #1e76fa;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .signature-section label {
            background: #b500a6;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .upload-area label:hover {
            background: #0b5ed7;
        }
        .signature-section label:hover {
            background: #9c008e;
        }
        .upload-area input[type="file"], .signature-section input[type="file"] {
            display: none;
        }
        .file-name, .sig-status {
            flex: 1;
            font-size: 14px;
            color: #222;
            background: white;
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid #ddd;
            min-width: 100px;
            word-break: break-word;
            text-align: center;
        }
        .btn {
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            justify-content: center;
        }
        .btn-primary { background: #0d6efd; color: white; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-primary2 { background: #703efa; color: white; }
        .btn-primary2:hover { background: #6026ff; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: #c90013; color: white; }
        .btn-danger:hover { background: #a30211; }
        .btn-danger2 { background: #ff0018; color: white; }
        .btn-danger2:hover { background: #d10216; }
        .btn-secondary { background: #717501; color: white; }
        .btn-secondary:hover { background: #5e6100; }
        .btn-secondary2 { background: #4f565c; color: white; }
        .btn-secondary2:hover { background: #3b4045; }
        .btn-warning { background: #ffc107; color: #1a1a1a; }
        .btn-warning:hover { background: #e0a800; }
        .btn-outline { background: transparent; border: 1.5px solid #0d6efd; color: #0d6efd; }
        .btn-outline:hover { background: #e9f0ff; }

        .controls, .sig-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 12px 0 10px;
            justify-content: center;
        }
        .controls .btn, .sig-actions .btn {
            flex: 1 0 auto;
            justify-content: center;
            min-width: 100px;
        }

        /* ניווט דפים */
        .page-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 12px 0 6px;
            padding: 6px 10px;
            background: #f1f3f5;
            border-radius: 40px;
            flex-wrap: wrap;
        }
        .page-controls span {
            font-weight: 600;
            font-size: 15px;
            color: #1a1a1a;
        }

        .page-indicator {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 8px 0 10px;
            flex-wrap: wrap;
            padding: 4px 0;
        }
        .page-dot {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #d0d0d0;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.15s;
            position: relative;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            touch-action: manipulation;
        }
        .page-dot.active {
            background: #0d6efd;
            color: white;
            border-color: #0d6efd;
            transform: scale(1.02);
        }
        .page-dot.has-signature {
            border-color: #28a745;
            background: #e6f5e6;
        }
        .page-dot.has-signature.active {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }
        .page-dot .sig-indicator {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 14px;
            height: 14px;
            background: #28a745;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .info-text {
            font-size: 14px;
            color: #444;
            margin: 6px 0 12px;
            text-align: center;
            background: #faf9e6;
            padding: 8px 12px;
            border-radius: 40px;
	    font-weight: 700
        }

        /* מיכל PDF */
        .pdf-container {
            border: 2px solid #ddd;
            border-radius: 18px;
            overflow: auto;
            background: #e9ecef;
            max-height: 85vh;
            padding: 12px 8px;
            touch-action: pan-y;
        }
        .pdf-page-wrapper {
            position: relative;
            margin: 0 auto 24px auto;
            background: white;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            display: block !important;
            max-width: 100%;
        }
        .pdf-page-wrapper canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            border-radius: 6px;
        }
        .signature-overlay {
            position: absolute;
            cursor: grab;
            touch-action: none;
            user-select: none;
            border: 3px solid #28a745;
            border-radius: 8px;
            padding: 3px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.20);
            z-index: 10;
            min-width: 50px;
            min-height: 36px;
            display: block !important;
        }
        .signature-overlay img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            border-radius: 4px;
        }
        .signature-overlay .resize-handle {
            position: absolute;
            bottom: -8px;
            right: -8px;
            width: 18px;
            height: 18px;
            background: #28a745;
            border-radius: 50%;
            cursor: nwse-resize;
            border: 2px solid white;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
            touch-action: none;
        }
        .signature-overlay .page-badge {
            position: absolute;
            top: -28px;
            right: 0;
            background: #28a745;
            color: white;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .signature-overlay .remove-sig-btn {
            position: absolute;
            top: -28px;
            left: 0;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 2px 12px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            touch-action: manipulation;
        }
        .signature-overlay .remove-sig-btn:hover {
            background: #c82333;
        }

        /* תחתית עמוד – ללא מסגור, במרכז */
        .app-footer {
            margin-top: 10px;
            padding: 12px 0 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0px;
        }
        .footer-text {
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 0.3px;
            text-align: center;
        }
        .footer-logo {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .footer-logo img {
            height: 80px;
            width: auto;
            max-width: 220px;
            object-fit: contain;
            display: block;
            background: transparent;
            padding: 2px;
        }

        @media (max-width: 600px) {
            .container { padding: 12px 8px; }
            h1 { font-size: 20px; text-align: center; }
            .upload-area, .signature-section { 
                flex-direction: column; 
                align-items: stretch; 
                gap: 8px;
            }
            .upload-area label, .signature-section label {
                justify-content: center;
                width: 100%;
            }
            .file-name, .sig-status { 
                min-width: auto; 
                width: 100%; 
                text-align: center;
            }
            .controls .btn, .sig-actions .btn { 
                min-width: 80px; 
                font-size: 13px; 
                padding: 8px 12px;
                flex: 1 0 auto;
                justify-content: center;
            }
            .controls, .sig-actions {
                justify-content: center;
            }
            .page-dot { width: 34px; height: 34px; font-size: 13px; }
            .signature-overlay .page-badge { font-size: 10px; top: -24px; padding: 1px 10px; }
            .signature-overlay .remove-sig-btn { font-size: 11px; top: -24px; padding: 1px 10px; }
            .pdf-container { padding: 8px 4px; max-height: 80vh; }
            .info-text { font-size: 13px; text-align: center; }
            .app-footer { margin-top: 20px; padding: 8px 0; }
            .footer-logo img { height: 40px; max-width: 140px; }
            .page-controls span { font-size: 13px; }
            .btn { font-size: 13px; padding: 8px 14px; }
        }
        @media (max-width: 400px) {
            .page-dot { width: 30px; height: 30px; font-size: 12px; }
            .btn { font-size: 12px; padding: 6px 10px; min-width: 70px; }
            .upload-area label, .signature-section label { font-size: 13px; padding: 6px 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📃 החתמת מסמך PDF</h1>

    <!-- העלאת PDF -->
    <div class="upload-area">
        <label for="pdfUpload">📤 העלה PDF</label>
        <input type="file" id="pdfUpload" accept=".pdf">
        <span class="file-name" id="pdfFileName">לא נבחר קובץ</span>
        <button class="btn btn-secondary2" id="clearPdfBtn">🧹 נקה</button>
    </div>

    <!-- העלאת חתימה -->
    <div class="signature-section">
        <label for="sigUpload">🖊️ העלה חתימה</label>
        <input type="file" id="sigUpload" accept="image/*">
        <span class="sig-status" id="sigStatus">לא נטענה חתימה</span>
        <button class="btn btn-danger2" id="clearSigBtn">הסר</button>
    </div>

    <!-- כפתורי פעולה -->
    <div class="controls">
        <button class="btn btn-primary" id="renderBtn">👀 הצג PDF</button>
        <button class="btn btn-success" id="downloadBtn">👇 הורד PDF</button>
        <button class="btn btn-secondary" id="resetSigPosBtn">⭕ אפס מיקום</button>
    </div>

    <!-- פעולות חתימה -->
    <div class="sig-actions">
        <button class="btn btn-primary2" id="addSigToCurrentPage">➕ הוסף לעמוד זה</button>
        <button class="btn btn-danger" id="removeSigFromCurrentPage">➖ הסר מעמוד זה</button>
        <button class="btn btn-warning" id="removeAllSignatures">🗑️ הסר הכל</button>
    </div>

    <!-- ניווט דפים -->
    <div class="page-controls">
        <span>📑 בחר עמוד:</span>
    </div>
    <div class="page-indicator" id="pageIndicator"></div>

    <div class="info-text">💡 לחץ על מספר עמוד לבחירה, גרור את החתימה להזזה, או הזז את הקצה למטה מימין לשינוי הגודל.</div>

    <!-- מיכל PDF -->
    <div class="pdf-container" id="pdfContainer">
        <div id="pdfPagesContainer"></div>
    </div>

    <!-- תחתית – ללא מסגור, במרכז -->
    <div class="app-footer">
        <div class="footer-text">2026 כל הזכויות שמורות ©</div>
        <div class="footer-logo">
            <img src="OG_Blue_Logo2.png" alt="OG_Blue_Logo2" id="footerLogoImg" onerror="this.style.display='none'">
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- מצב גלובלי ----------
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let scale = 1.5;          // ברירת מחדל, מותאם דינמית
        let pdfData = null;
        let signatureImageData = null;

        let signaturePositions = {};
        let pagesWithSignature = new Set();

        const DEFAULT_SIG = { x: 80, y: 80, width: 120, height: 70 };

        const container = document.getElementById('pdfContainer');
        const pagesContainer = document.getElementById('pdfPagesContainer');
        const pdfUpload = document.getElementById('pdfUpload');
        const sigUpload = document.getElementById('sigUpload');
        const pdfFileName = document.getElementById('pdfFileName');
        const sigStatus = document.getElementById('sigStatus');
        const renderBtn = document.getElementById('renderBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearPdfBtn = document.getElementById('clearPdfBtn');
        const clearSigBtn = document.getElementById('clearSigBtn');
        const resetSigPosBtn = document.getElementById('resetSigPosBtn');
        const pageIndicator = document.getElementById('pageIndicator');
        const addSigBtn = document.getElementById('addSigToCurrentPage');
        const removeSigBtn = document.getElementById('removeSigFromCurrentPage');
        const removeAllBtn = document.getElementById('removeAllSignatures');

        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;
        let isResizing = false;
        let activeOverlayPage = null;

        // ---------- פונקציות עזר ----------
        function getPageWrapper(pageNum) {
            return document.querySelector(`.pdf-page-wrapper[data-page="${pageNum}"]`);
        }
        function getPageOverlay(pageNum) {
            const wrapper = getPageWrapper(pageNum);
            if (!wrapper) return null;
            return wrapper.querySelector('.signature-overlay');
        }
        function getPageCanvas(pageNum) {
            const wrapper = getPageWrapper(pageNum);
            if (!wrapper) return null;
            return wrapper.querySelector('canvas');
        }
        function getSignaturePosition(pageNum) {
            if (!signaturePositions[pageNum]) {
                signaturePositions[pageNum] = { ...DEFAULT_SIG };
            }
            return signaturePositions[pageNum];
        }
        function hasSignature(pageNum) {
            return pagesWithSignature.has(pageNum);
        }
        function updateOverlayPosition(pageNum) {
            const overlay = getPageOverlay(pageNum);
            if (!overlay) return;
            const pos = getSignaturePosition(pageNum);
            overlay.style.left = pos.x + 'px';
            overlay.style.top = pos.y + 'px';
            overlay.style.width = pos.width + 'px';
            overlay.style.height = pos.height + 'px';
        }

        // ציור חתימה על קנבס
        function drawSignatureOnCanvas(canvas, pageNum) {
            if (!signatureImageData || !canvas) return;
            if (!hasSignature(pageNum)) return;
            const pos = getSignaturePosition(pageNum);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, pos.x, pos.y, pos.width, pos.height);
            };
            img.src = signatureImageData;
        }

        // רינדור עמוד בודד – תוך התאמת קנה מידה לנייד
        function renderPage(pageNum) {
            if (!pdfDoc) return;

            const existingWrapper = document.querySelector(`.pdf-page-wrapper[data-page="${pageNum}"]`);
            if (existingWrapper) existingWrapper.remove();

            pdfDoc.getPage(pageNum).then(page => {
                // התאמת קנה מידה דינמית לפי רוחב המסך
                const containerWidth = container.clientWidth - 24; // padding
                const baseViewport = page.getViewport({ scale: 1 });
                let idealScale = containerWidth / baseViewport.width;
                // הגבלה: לא יותר מ-2.0, לא פחות מ-0.6
                idealScale = Math.min(2.0, Math.max(0.6, idealScale));
                scale = idealScale;

                const viewport = page.getViewport({ scale: scale });
                const wrapper = document.createElement('div');
                wrapper.className = 'pdf-page-wrapper';
                wrapper.dataset.page = pageNum;
                wrapper.style.position = 'relative';
                wrapper.style.width = viewport.width + 'px';
                wrapper.style.margin = '0 auto 24px auto';
                wrapper.style.maxWidth = '100%';

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.display = 'block';
                canvas.style.width = '100%';
                canvas.style.height = 'auto';

                wrapper.appendChild(canvas);
                pagesContainer.appendChild(wrapper);

                const renderContext = {
                    canvasContext: canvas.getContext('2d'),
                    viewport: viewport
                };

                page.render(renderContext).promise.then(() => {
                    if (signatureImageData && hasSignature(pageNum)) {
                        drawSignatureOnCanvas(canvas, pageNum);
                        addOverlayToPage(pageNum);
                    }
                    if (pageNum === currentPage) {
                        wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            });
        }

        // הוספת overlay
        function addOverlayToPage(pageNum) {
            const wrapper = getPageWrapper(pageNum);
            if (!wrapper) return;
            const oldOverlay = wrapper.querySelector('.signature-overlay');
            if (oldOverlay) oldOverlay.remove();
            if (!signatureImageData || !hasSignature(pageNum)) return;

            const pos = getSignaturePosition(pageNum);
            const overlay = document.createElement('div');
            overlay.className = 'signature-overlay';
            overlay.dataset.page = pageNum;
            overlay.style.position = 'absolute';
            overlay.style.left = pos.x + 'px';
            overlay.style.top = pos.y + 'px';
            overlay.style.width = pos.width + 'px';
            overlay.style.height = pos.height + 'px';

            const badge = document.createElement('div');
            badge.className = 'page-badge';
            badge.textContent = `✍️ עמוד ${pageNum}`;
            overlay.appendChild(badge);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-sig-btn';
            removeBtn.textContent = '✕';
            removeBtn.title = 'הסר חתימה';
            removeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                removeSignatureFromPage(pageNum);
            });
            overlay.appendChild(removeBtn);

            const img = document.createElement('img');
            img.src = signatureImageData;
            img.alt = 'חתימה';
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'contain';
            overlay.appendChild(img);

            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'resize-handle';
            overlay.appendChild(resizeHandle);

            wrapper.appendChild(overlay);
            attachOverlayEvents(overlay, pageNum);
        }

        // אירועים ל-overlay (עכבר + מגע)
        function attachOverlayEvents(overlay, pageNum) {
            if (!overlay) return;
            const resizeHandle = overlay.querySelector('.resize-handle');

            // ------ עכבר ------
            overlay.addEventListener('mousedown', function(e) {
                if (e.target === resizeHandle || e.target.classList.contains('remove-sig-btn')) return;
                isDragging = true;
                activeOverlayPage = pageNum;
                const rect = overlay.getBoundingClientRect();
                const wrapper = getPageWrapper(pageNum);
                if (!wrapper) return;
                dragOffsetX = e.clientX - rect.left;
                dragOffsetY = e.clientY - rect.top;
                overlay.style.cursor = 'grabbing';
                e.preventDefault();
            });

            resizeHandle.addEventListener('mousedown', function(e) {
                isResizing = true;
                activeOverlayPage = pageNum;
                e.stopPropagation();
                e.preventDefault();

                const onMouseMove = function(e) {
                    if (!isResizing) return;
                    const wrapper = getPageWrapper(pageNum);
                    if (!wrapper) return;
                    const wrapperRect = wrapper.getBoundingClientRect();
                    const pos = getSignaturePosition(pageNum);
                    let newWidth = e.clientX - wrapperRect.left - pos.x;
                    let newHeight = e.clientY - wrapperRect.top - pos.y;
                    newWidth = Math.max(40, Math.min(newWidth, wrapperRect.width - pos.x - 10));
                    newHeight = Math.max(30, Math.min(newHeight, wrapperRect.height - pos.y - 10));
                    pos.width = newWidth;
                    pos.height = newHeight;
                    updateOverlayPosition(pageNum);
                    redrawPageWithSignature(pageNum);
                };

                const onMouseUp = function() {
                    isResizing = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging || activeOverlayPage !== pageNum) return;
                const wrapper = getPageWrapper(pageNum);
                if (!wrapper) return;
                const wrapperRect = wrapper.getBoundingClientRect();
                const pos = getSignaturePosition(pageNum);
                let newX = e.clientX - wrapperRect.left - dragOffsetX;
                let newY = e.clientY - wrapperRect.top - dragOffsetY;
                newX = Math.max(0, Math.min(newX, wrapperRect.width - pos.width - 10));
                newY = Math.max(0, Math.min(newY, wrapperRect.height - pos.height - 10));
                pos.x = newX;
                pos.y = newY;
                updateOverlayPosition(pageNum);
                redrawPageWithSignature(pageNum);
            });

            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    overlay.style.cursor = 'grab';
                    activeOverlayPage = null;
                }
            });

            // ------ מגע (touch) ------
            let touchDrag = false, touchResize = false;

            overlay.addEventListener('touchstart', function(e) {
                if (e.target === resizeHandle || e.target.classList.contains('remove-sig-btn')) return;
                touchDrag = true;
                activeOverlayPage = pageNum;
                const touch = e.touches[0];
                const rect = overlay.getBoundingClientRect();
                dragOffsetX = touch.clientX - rect.left;
                dragOffsetY = touch.clientY - rect.top;
                e.preventDefault();
            }, { passive: false });

            resizeHandle.addEventListener('touchstart', function(e) {
                touchResize = true;
                activeOverlayPage = pageNum;
                e.stopPropagation();
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchmove', function(e) {
                if (!touchDrag && !touchResize) return;
                if (activeOverlayPage !== pageNum) return;
                const touch = e.touches[0];
                const wrapper = getPageWrapper(pageNum);
                if (!wrapper) return;
                const wrapperRect = wrapper.getBoundingClientRect();
                const pos = getSignaturePosition(pageNum);

                if (touchDrag) {
                    let newX = touch.clientX - wrapperRect.left - dragOffsetX;
                    let newY = touch.clientY - wrapperRect.top - dragOffsetY;
                    newX = Math.max(0, Math.min(newX, wrapperRect.width - pos.width - 10));
                    newY = Math.max(0, Math.min(newY, wrapperRect.height - pos.height - 10));
                    pos.x = newX;
                    pos.y = newY;
                    updateOverlayPosition(pageNum);
                    redrawPageWithSignature(pageNum);
                }
                if (touchResize) {
                    let newWidth = touch.clientX - wrapperRect.left - pos.x;
                    let newHeight = touch.clientY - wrapperRect.top - pos.y;
                    newWidth = Math.max(40, Math.min(newWidth, wrapperRect.width - pos.x - 10));
                    newHeight = Math.max(30, Math.min(newHeight, wrapperRect.height - pos.y - 10));
                    pos.width = newWidth;
                    pos.height = newHeight;
                    updateOverlayPosition(pageNum);
                    redrawPageWithSignature(pageNum);
                }
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchend', function() {
                touchDrag = false;
                touchResize = false;
                activeOverlayPage = null;
            });
        }

        // עזר: רענון קנבס + overlay
        function redrawPageWithSignature(pageNum) {
            const canvas = getPageCanvas(pageNum);
            if (!canvas || !pdfDoc) return;
            pdfDoc.getPage(pageNum).then(page => {
                const viewport = page.getViewport({ scale: scale });
                const ctx = canvas.getContext('2d');
                const renderContext = { canvasContext: ctx, viewport: viewport };
                page.render(renderContext).promise.then(() => {
                    if (signatureImageData && hasSignature(pageNum)) {
                        drawSignatureOnCanvas(canvas, pageNum);
                    }
                });
            });
        }

        // הוספת חתימה לעמוד
        function addSignatureToPage(pageNum) {
            if (!signatureImageData) { alert('אנא העלה תמונת חתימה תחילה.'); return; }
            if (!pdfDoc) { alert('אנא העלה קובץ PDF תחילה.'); return; }
            pagesWithSignature.add(pageNum);
            if (!signaturePositions[pageNum]) {
                signaturePositions[pageNum] = { ...DEFAULT_SIG };
            }
            renderPage(pageNum);
            updatePageIndicator();
        }

        function removeSignatureFromPage(pageNum) {
            pagesWithSignature.delete(pageNum);
            delete signaturePositions[pageNum];
            renderPage(pageNum);
            updatePageIndicator();
        }

        function renderAllPages() {
            if (!pdfDoc) return;
            pagesContainer.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                renderPage(i);
            }
            updatePageIndicator();
        }

        function updatePageIndicator() {
            pageIndicator.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const dot = document.createElement('div');
                dot.className = 'page-dot';
                if (i === currentPage) dot.classList.add('active');
                if (hasSignature(i)) dot.classList.add('has-signature');
                dot.textContent = i;
                if (hasSignature(i)) {
                    const indicator = document.createElement('div');
                    indicator.className = 'sig-indicator';
                    dot.appendChild(indicator);
                }
                dot.addEventListener('click', function() { goToPage(i); });
                pageIndicator.appendChild(dot);
            }
        }

        function goToPage(pageNum) {
            if (pageNum < 1 || pageNum > totalPages) return;
            currentPage = pageNum;
            updatePageIndicator();
            const wrapper = getPageWrapper(pageNum);
            if (wrapper) {
                wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // טעינת PDF
        function loadPdfFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                pdfData = e.target.result;
                pdfFileName.textContent = file.name;
                pdfjsLib.getDocument({ data: pdfData }).promise.then(doc => {
                    pdfDoc = doc;
                    totalPages = doc.numPages;
                    currentPage = 1;
                    signaturePositions = {};
                    pagesWithSignature = new Set();
                    renderAllPages();
                    setTimeout(() => {
                        const wrapper = getPageWrapper(1);
                        if (wrapper) wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 400);
                }).catch(err => {
                    alert('שגיאה בטעינת PDF: ' + err.message);
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function loadSignatureFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                signatureImageData = e.target.result;
                sigStatus.textContent = '✅ חתימה נטענה';
                if (pdfDoc) renderAllPages();
            };
            reader.readAsDataURL(file);
        }

        // ---------- אירועים ----------
        pdfUpload.addEventListener('change', function(e) {
            if (this.files && this.files[0]) loadPdfFile(this.files[0]);
        });
        sigUpload.addEventListener('change', function(e) {
            if (this.files && this.files[0]) loadSignatureFile(this.files[0]);
        });

        renderBtn.addEventListener('click', function() {
            if (pdfDoc) renderAllPages();
            else alert('אנא העלה קובץ PDF תחילה.');
        });

        addSigBtn.addEventListener('click', function() { addSignatureToPage(currentPage); });
        removeSigBtn.addEventListener('click', function() {
            if (hasSignature(currentPage)) removeSignatureFromPage(currentPage);
            else alert('אין חתימה בעמוד זה.');
        });
        removeAllBtn.addEventListener('click', function() {
            if (pagesWithSignature.size === 0) { alert('אין חתימות להסרה.'); return; }
            if (confirm('האם להסיר את כל החתימות?')) {
                pagesWithSignature = new Set();
                signaturePositions = {};
                renderAllPages();
            }
        });

        clearPdfBtn.addEventListener('click', function() {
            pdfDoc = null; pdfData = null; pdfFileName.textContent = 'לא נבחר קובץ';
            pagesContainer.innerHTML = ''; totalPages = 0; currentPage = 1;
            signaturePositions = {}; pagesWithSignature = new Set();
            updatePageIndicator(); pdfUpload.value = '';
        });

        clearSigBtn.addEventListener('click', function() {
            signatureImageData = null; sigStatus.textContent = 'לא נטענה';
            sigUpload.value = ''; pagesWithSignature = new Set(); signaturePositions = {};
            if (pdfDoc) renderAllPages();
        });

        resetSigPosBtn.addEventListener('click', function() {
            for (let page of pagesWithSignature) {
                signaturePositions[page] = { ...DEFAULT_SIG };
            }
            if (pdfDoc && signatureImageData) renderAllPages();
        });

        // ---------- הורדת PDF ----------
        downloadBtn.addEventListener('click', function() {
            if (!pdfData) { alert('אין PDF להורדה.'); return; }
            if (!signatureImageData) { alert('לא נטענה חתימה.'); return; }
            if (pagesWithSignature.size === 0) { alert('לא הוספת חתימה לאף עמוד.'); return; }

            const script = document.createElement('script');
            script.src = 'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js';
            document.head.appendChild(script);
            script.onload = function() {
                const { PDFDocument } = window.PDFLib;
                PDFDocument.load(pdfData).then(async (doc) => {
                    const pages = doc.getPages();
                    const sigImage = await doc.embedPng(signatureImageData);
                    for (let i = 0; i < pages.length; i++) {
                        const pageNum = i + 1;
                        if (!hasSignature(pageNum)) continue;
                        const page = pages[i];
                        const { width, height } = page.getSize();
                        const pos = getSignaturePosition(pageNum);
                        const canvas = getPageCanvas(pageNum);
                        if (!canvas) continue;
                        const relX = pos.x / canvas.width;
                        const relY = pos.y / canvas.height;
                        const relW = pos.width / canvas.width;
                        const relH = pos.height / canvas.height;
                        page.drawImage(sigImage, {
                            x: relX * width,
                            y: height - (relY * height) - (relH * height),
                            width: relW * width,
                            height: relH * height,
                        });
                    }
                    const pdfBytes = await doc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'document_with_signature.pdf';
                    link.click();
                    URL.revokeObjectURL(url);
                }).catch(err => { alert('שגיאה ביצירת PDF: ' + err.message); });
            };
            script.onerror = function() { alert('שגיאה בטעינת ספריית pdf-lib'); };
        });

        // אתחול
        updatePageIndicator();
        console.log('✅ מוכן – חתימה מוצגת וניתנת להזזה/שינוי גודל בעמודים הנבחרים');
    })();
</script>
</body>
</html>
